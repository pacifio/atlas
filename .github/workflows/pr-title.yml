name: PR title

# Pull requests are squash-merged, so the title becomes the one commit on
# `main`, and release-please reads those commits to pick the next version and
# write CHANGELOG.md (see release.yml). This check holds the title to
# Conventional Commits: `feat(scope): …`, `fix: …`, `chore!: …`.
#
# `pull_request_target`, so a fork's PR is checked without a maintainer first
# approving its workflow run. Safe here: nothing is checked out and no code from
# the PR runs; the action reads the title from the event.

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  title:
    name: Conventional Commit title
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: amannn/action-semantic-pull-request@v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            style
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^.+$
