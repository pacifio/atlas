# BLOCKER B (#39/#42): `tree-sitter` sets `links = "tree-sitter"`, so the fork
# and `atlas-codeindex` cannot hold different majors. D4 resolves it by
# bumping the fork rather than pinning Atlas back: upstream was 0.25.10 here.
# `tree-sitter-bash` stays at 0.25 — there is no 0.26 of it, and it does not
# need one: grammar crates bind to the `tree-sitter-language` shim rather than
# to the core, which is exactly what lets one core serve grammars of several
# vintages (Atlas's own are 0.23).
tree-sitter = "0.26"
tree-sitter-bash = "0.25"
ts-rs = "11"
tungstenite = { version = "0.27.0", features = ["deflate", "proxy"] }
uds_windows = "1.1.0"
