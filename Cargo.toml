# `default-features = false`: reqwest's default set is `default-tls` + the
# three below. `default-tls` is native-tls (Security.framework on macOS), which
# no consumer wants — every vendored and Atlas crate asks for `rustls-tls` —
# yet with both on, any `Client::new()` that never called `.use_rustls_tls()`
# silently took native-tls. Dropping it removes native-tls, hyper-tls and
# tokio-native-tls from the graph and puts every client on rustls/ring.
# `cookies` stays: atlas-engine-http-client implements `reqwest::cookie::CookieStore`.
reqwest = { version = "0.12", default-features = false, features = [
    "charset",
    "http2",
    "system-proxy",
    "cookies",
    "rustls-tls",
] }
# NOTE (Sep-03 audit): rmcp, rig-core and posthog-rs are the three crates
# holding a second reqwest (0.13) tower in the lock, duplicating hyper/h2/
# http/tower behind it. The collapse runs FORWARD, not back: all three have
# 0.13 as their floor in every current release, so unification means moving
# the app AND the vendored engine to 0.13 — an upstream-sync-sized change,
# not a pin. Left as-is deliberately.
