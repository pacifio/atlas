[workspace.lints]

# `unexpected_cfgs` is a deny because its warning form already cost a live
# failure: #54 deleted the `ported-engine` feature, four blocks stayed behind
# `#[cfg(feature = "ported-engine")]`, and a cfg on a feature that no longer
# exists compiles to NOTHING — the token-source registration vanished and the
# first real gateway turn went out with no Authorization header. Cargo warned;
# nobody greps warnings. Now it fails the build.
rust = { unexpected_cfgs = "deny" }

[workspace.lints.clippy]

# `unwrap_used` and `expect_used` are STAGED, not enforced: turning the table
# on for the first-party members (#60) surfaced ~220 violations of the pair,
# overwhelmingly in test code where a panic IS the failure report. Re-add them
# behind a cleanup pass rather than allowlisting two hundred call sites in one
# sweep. Every other deny below is live and clean.
await_holding_invalid_type = "deny"
await_holding_lock = "deny"
disallowed_methods = "deny"
identity_op = "deny"
manual_clamp = "deny"
manual_filter = "deny"
manual_find = "deny"
manual_flatten = "deny"
manual_map = "deny"
manual_memcpy = "deny"
manual_non_exhaustive = "deny"
manual_ok_or = "deny"
manual_range_contains = "deny"
manual_retain = "deny"
manual_strip = "deny"
manual_try_fold = "deny"
manual_unwrap_or = "deny"
needless_borrow = "deny"
needless_borrowed_reference = "deny"
needless_collect = "deny"
needless_late_init = "deny"
needless_option_as_deref = "deny"
needless_question_mark = "deny"
needless_update = "deny"
redundant_clone = "deny"
redundant_closure = "deny"
redundant_closure_for_method_calls = "deny"
redundant_static_lifetimes = "deny"
trivially_copy_pass_by_ref = "deny"
uninlined_format_args = "deny"
unnecessary_filter_map = "deny"
unnecessary_lazy_evaluations = "deny"
unnecessary_sort_by = "deny"
unnecessary_to_owned = "deny"

# cargo-shear cannot see the platform-specific openssl-sys usage, so we
# silence the false positive here instead of deleting a real dependency.

# ─── Cersei SDK — gone (#54) ─────────────────────────────────────────────────
# The `cersei-provider` and `cersei-agent` patch entries lived here. They
# carried two fixes the published crates lacked: incremental UTF-8 decoding in
# the SSE decoders, and racing `tool.execute()` against the cancel token.
#
# Both failures are still guarded, by tests against the engine that replaced
# them rather than by a patch table: a chunk-split fixture that splits an SSE
# frame at every byte position, and a cancel test that asserts on the
# filesystem — the killed command's marker file never appears.
[patch.crates-io]

# ─── The vendored engine's own git forks ─────────────────────────────────────
# Copied from the fork point's `[patch.crates-io]`. A patch table is honored
# only in the manifest cargo was invoked on, so upstream's copy is inert now
# that these crates are members here: without these three lines the engine
# silently resolves the unforked crates instead (#42).
# crossterm is deliberately NOT patched here, though upstream patches it.
# Its only consumer is the TUI, which is outside the vendored closure, so
# carrying the entry earned a "patch was not used in the crate graph"
# warning on every cargo invocation and patched nothing. Restore it with
# the TUI, if the TUI is ever ported.
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

# Upstream also patches the ssh spelling of the same fork, because a dependency
# names it that way. Verbatim; dropping it resolves tungstenite twice.
[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

# Release profile — Atlas previously shipped with Cargo defaults
# (lto = false, codegen-units = 16, no strip), which means the bundled .app
# binary was substantially larger and slower than necessary.
#
# Trade-off: `bun run build:app` link time roughly doubles on clean builds
# (~30 s → ~60–90 s). Dev (`tauri dev`) is unaffected — these are
# release-only settings.
[profile.release]
codegen-units = 1   # Single codegen unit → better cross-function inlining
lto = "fat"         # Fat LTO: maximum cross-crate dead-code elimination +
                    # inlining (smaller binary; ~2× link time vs thin)
strip = "symbols"   # Smaller .app bundle, faster dyld load
panic = "unwind"    # REQUIRED — three independent `catch_unwind` guards depend on
                    # it, so this survived the local-LLM removal:
                    #  1. atlas-embed's EMBEDDER catches candle's Metal
                    #     kernel-compile panic (at load AND per forward) to fall
                    #     back to CPU rather than crash.
                    #  2. commands/capture.rs guards its worker threads — a
                    #     panicking worker is silent capture loss.
                    #  3. atlas-checkpoint wraps atlas-redact, so a redaction
                    #     panic can never leak unredacted text.
                    # `abort` would turn each of these into an app crash. Costs a
                    # little binary size for unwind tables.
opt-level = 3       # Default for release, restated for clarity

# Build scripts and proc-macro crates are COMPILE-TIME ONLY — none of their
# code is linked into the shipped binary, and LTO never touches them. Without
# this stanza they inherit `opt-level = 3` / `codegen-units = 1` from the
# profile above, so the build spends real time optimizing 317 build scripts and
# 143 proc-macro dylibs whose only job is to run once and exit.
#
# `opt-level = 0` makes them compile fast and run slower; the trade is only
# worth it while the running is cheap relative to the compiling, which it is
# here (measure before assuming it holds — a proc-macro-bound build can invert
# it). Shipped output is bit-identical either way: this cannot affect binary
# size, speed, or the `panic = "unwind"` guarantees above.
[profile.release.build-override]
opt-level = 0
codegen-units = 256

# Dev profile — Atlas's own app crate is small (~170 LOC + a handful of
# command modules). Keep it at the default `opt-level = 0` so incremental
# rebuilds stay snappy. Its per-package stanza is deliberately absent below.
[profile.dev]
# Full DWARF for 130 members + their deps produced a 104 GB `target/debug` and
# paid for itself on every link. `line-tables-only` keeps what is actually read
# day to day — panic backtraces with file:line, and profiler symbols — and drops
# only variable inspection in a debugger. Restore `debug = true` locally (never
# commit it) on the rare occasion you need to step through Rust in lldb.
debug = "line-tables-only"

# Optimize ALL transitive dependencies in dev mode at `opt-level = 1`
# (Tauri, wry, tao, tokio, serde, reqwest, the vendored cersei forks, etc.).
# First clean build pays a one-time ~3–5 minute cost; subsequent rebuilds only
# recompile the app crate and are unaffected. Net effect: `bunx tauri dev`
# startup drops noticeably because Tauri's runtime is no longer running
# unoptimized debug code.
[profile.dev.package."*"]
opt-level = 1

# `"*"` above reaches dependencies ONLY — workspace members are excluded from
# it by cargo. Before the workspace, every `crates/atlas-*` package was a plain
# path dependency of src-tauri and therefore covered; as members they would
# silently drop to opt-level 0 and `tauri dev` would run the ACP stack, the
# terminal, the embedder and the RAG engine unoptimized. Restating the level
# per member is the only way to express "unchanged" (D4: "preserve dev-profile
# opt-levels for workspace members explicitly").
#
# Adding a member means adding a stanza here; `tests/cargo-workspace.test.ts`
# fails if one is missing.
[profile.dev.package.atlas-acp-thread]
opt-level = 1
[profile.dev.package.atlas-agent-delta]
opt-level = 1
[profile.dev.package.atlas-agent-manager]
opt-level = 1
