# Deliberately outside the workspace. Each is built on its own, with its own
# lockfile and its own profile, and joining the workspace would change that
# silently. Profiles are workspace-global — the root's `[profile.release]` is
# the only one cargo reads — so a member cannot keep a release profile of its
# own, whatever the per-package override table (bottom of this file) can express.
exclude = [
  # Not in the app's dependency graph at all: a template binary that
  # `commands::knowledge_export` compiles on demand at runtime with
  # `--manifest-path`, carrying its own `[profile.release]` (`panic = "abort"`,
  # thin LTO). As a member it would rebuild under the app's fat-LTO/unwind
  # profile instead.
  "crates/atlas-kb-server",
]

# ─── Vendored engine (ADR-0003 fork point `42b5f05`; renamed in ADR-0011) ──────────
# The engine closure, vendored whole: no submodule, no upstream remote, no
# upstream tracking (ADR-0003, D2, D4 — issue #42). Copied from
# the upstream repository @ 42b5f05 with `target/` excluded; upstream's LICENSE and
# NOTICE travel with the code in `vendor/atlas-engine/`, as Apache-2.0 §4 requires.
#
# **"Quarantined" here means the phone-home PATHS are severed, not that the
# crates are unused** — the Sep-03 audit misread the old wording exactly that
# way, so say it precisely: 104 of these 110 members ARE in the shipping
# binary's closure. What does not ship is their telemetry: `atlas-engine-analytics`
# had its destination, POST and capture sink removed (#43, spec D2; the local
# fact-reducer stays for its 79 tests), `atlas-engine-otel` defaults to
# `exporter: None` (upstream defaulted to a hardcoded Statsig endpoint), and
# `atlas-engine-feedback`'s uploader is gone — its `sentry` dep is now `sentry-types`
# for one test-only attachment builder. `tests/engine-quarantine.test.ts`
# documents which crates the containment rules cover.
#
# Closure size, because it is not the number the spec quotes: the Port
# Inventory's "77 crates, 63 droppable" is the closure of `atlas-engine-core`. D1
# chose the in-process **app-server client**, whose closure is larger — it also
# pulls `atlas-engine-app-server` itself and the `ext/` extensions the inventory lists
# as droppable. 105 crates normal+build, 110 including the five test-support
# crates the vendored crates' own dev-dependencies need (the spec's Testing
# Decisions keep upstream's suite). Upstream has 140 members, so 30 are
# dropped, not 63.

[workspace.package]

version = "0.0.0"
# Track the edition for all workspace crates in one place. Individual
# crates can still override this value, but keeping it here means new
# crates created with `cargo new -w ...` automatically inherit the 2024
# edition.
edition = "2024"
license = "Apache-2.0"

# Two things this table does to Atlas's own build, both disclosed rather than
# absorbed (#42, "behaves identically"):
#
#   - `tar = "=0.4.45"` is an EXACT pin, and `atlas-agent-store` asks for `0.4`.
#     Cargo intersects them, so Atlas's `tar` moved 0.4.46 -> 0.4.45. A patch
#     step within one semver-compatible major; the alternative is editing the
#     fork's pin, which belongs to the rip-out phase, not to vendoring.
#   - Duplicate majors. The engine brings older majors of ~60 crates Atlas
#     already uses (http 0.2 beside 1.4, zbus 4 beside 5, windows 0.58 beside
#     0.61, ...). They coexist; Atlas's own version is retained in every case,
#     and none of them reaches the shipping app's build graph — verified with
#     `cargo tree -p atlas --edges normal`, not inferred from the lockfile,
#     because `cargo metadata`'s resolve graph is a workspace-wide union and
#     reports edges the app never compiles.

# Upstream's workspace dependency table, verbatim except that internal `path`
# entries are rebased onto `vendor/atlas-engine/`. 24 entries naming crates outside the
# vendored closure are dropped rather than left dangling.
