# bun auto-installs peer dependencies (`install.peer` defaults to true). This
# repo turned that off (commit 4fff352b) when one dependency's unused peers
# added ~170 MB to node_modules that never reached the bundle.
#
# Anything Atlas genuinely needs is a real dependency in `package.json`, so a
# peer that stops resolving is a missing dependency to declare, not a reason to
# turn this back on.
[install]
peer = false
