[package]
name = "atlas-acp"
version = "0.1.0"
edition = "2024"

[dependencies]
atlas-agent-wire = { path = "../atlas-agent-wire" }
# Enable every `unstable_*` schema feature — claude-agent-acp's SDK
# emits notifications gated on these (e.g. `usage_update`, `current_model_update`).
# Without them turned on, the strongly-typed `SessionNotification` deserializer
# rejects the unknown variant with a `-32602 Invalid params`, the agent's
# `await client.sessionUpdate(...)` throws, and downstream output (slash
# command bodies, streaming chunks after the rejected one) is dropped on
# the floor. Keep this list in sync with whatever the vendored adapter at
# `third-party/claude-agent-acp/` actually sends.
# ACP 1.x: the `unstable` feature turns on the message-id / model / usage /
# resume / close / fork / logout / additional-directories schema variants the
# claude-agent-acp + codex-acp adapters emit (previously a list of `unstable_*`
# flags on 0.11). The `agent-client-protocol-tokio` helper is gone (never moved
# past 0.11); the stdio transport + client wiring lives in driver.rs now.
agent-client-protocol = { version = "1.3", features = ["unstable"] }
# P0.1 (plans/atlas-acp-parity-loop.md): the umbrella `unstable` feature on the
# TOP-LEVEL crate only covers auth_methods / elicitation / end_turn_token_usage /
# mcp_over_acp / session_fork. `unstable_llm_providers` and
# `unstable_plan_operations` exist ONLY on the schema crate (agent-client-protocol
# never gates on them), so the only way to reach those types is to depend on the
# schema directly and let Cargo feature-unification turn them on for the single
# shared schema build. The types then surface through the existing
# `agent_client_protocol::schema::v1::*` re-export — no second import path.
# Version is `=1.4.0` because agent-client-protocol 1.3.0 pins it exactly; a
# looser req would silently split the build into two incompatible schema copies.
# Deliberately NOT enabled: `unstable_nes` (editor-prediction surface, out of
# scope for a chat app — see P3.6) and `unstable_protocol_v2` (v1 is our wire
# format; it also drags in `diffy`).
agent-client-protocol-schema = { version = "=1.4.0", features = [
    "unstable_llm_providers",
    "unstable_plan_operations",
] }
tokio = { version = "1.52", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
dashmap = "6"
# P1.2: the PTY command-runner behind the client-served `terminal/*` methods.
# `atlas-terminal` owns every PTY concern in the tree; atlas-acp stays protocol.
atlas-terminal = { path = "../atlas-terminal" }
