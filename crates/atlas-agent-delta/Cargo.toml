[package]
name = "atlas-agent-delta"
version = "0.1.0"
edition = "2021"
description = "Projects thread events into the additive-only SessionDelta wire."

[lib]
name = "atlas_agent_delta"

[dependencies]
# Same exact pin as the rest of the ACP stack.
agent-client-protocol = { version = "=2.0.0", features = ["unstable"] }
atlas-acp-thread = { path = "../atlas-acp-thread" }
# For `ThreadEventSink`, the shape `ConnectOptions` wants.
atlas-agent-servers = { path = "../atlas-agent-servers" }
# The session-delta wire. Names no protocol version, so it is a crate of its own.
atlas-agent-wire = { path = "../atlas-agent-wire" }
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
atlas-bus = { path = "../atlas-bus" }
atlas-terminal = { path = "../atlas-terminal" }
anyhow = "1"
futures = "0.3"
tokio = { version = "1", features = ["full", "test-util"] }
uuid = { version = "1", features = ["v4"] }

# The workspace lint table is only real for members that opt in —
# without this stanza it is dead configuration (#60).
[lints]
workspace = true
