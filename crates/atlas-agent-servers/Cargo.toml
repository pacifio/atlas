[package]
name = "atlas-agent-servers"
version = "0.1.0"
edition = "2021"

[dependencies]
atlas-process = { path = "../atlas-process" }
# Same exact pin as `atlas-acp-thread`.
agent-client-protocol = { version = "=2.0.0", features = ["unstable"] }
atlas-acp-thread = { path = "../atlas-acp-thread" }
atlas-terminal = { path = "../atlas-terminal" }
anyhow = "1"
chrono = "0.4"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "process", "io-util", "macros", "time"] }
# Bridges tokio's AsyncRead/AsyncWrite to the futures traits the SDK transport
# expects.
tokio-util = { version = "0.7", features = ["compat"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

# `setsid` + `killpg`, so an agent's whole process tree dies with its
# connection (see `AgentChild` in connection.rs). Same pin as atlas-terminal.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

# The workspace lint table is only real for members that opt in —
# without this stanza it is dead configuration (#60).
[lints]
workspace = true
