[package]
name = "atlas-cersei"
version = "0.1.0"
edition = "2021"
description = "Atlas's native in-process coding agent, built on the Cersei agent SDK."

[lib]
name = "atlas_cersei"

[dependencies]
# Cersei agent SDK — the in-process agentic loop (provider builders, tools,
# permission policies, streaming events). Same pin as atlas-codeindex so the two
# Cersei consumers share one resolved version.
# `default-features = false` drops the `vms` feature (cersei-vms ~4.5MB rlib +
# its sub-crates) — Atlas does not use the VM tools. All cersei consumers must
# agree (feature unification), so atlas-codeindex/atlas-memory do the same.
cersei = { version = "0.2.6", default-features = false }
# The agent crate directly, for the built-in `DelegateTool` + delegate batch
# runner (parallel in-process sub-agents) — not re-exported by the `cersei`
# facade. Same pin so Cargo unifies one build.
cersei-agent = "0.2.6"
# RTK (Rust Token Killer) tool-output compression — `CompressionLevel`, not
# re-exported by the `cersei` facade. User-toggleable per session.
cersei-compression = "0.2.6"
# Cooperative cancellation of an in-flight turn.
tokio-util = "0.7"
# Gitignore-aware recursive walker (ripgrep's own crate) backing the native
# `List` tool — no external `rg`/`grep` binary. Unifies with cersei-tools'
# transitive `ignore` (0.4.26 in the lockfile), so no extra build.
ignore = "0.4"
# Shared identifiers + the EventSink / AcpEvent contract. The native runtime
# adapts Cersei's event stream into the SAME AcpEvent shape the ACP driver
# emits, so atlas-agents' dispatch/state/UI path is reused unchanged.
atlas-acp = { path = "../atlas-acp" }
# Needed to CONSTRUCT the typed ACP schema values (`SessionUpdate`,
# `ToolCallUpdate`, `PermissionOption`) that ride inside `AcpEvent`. Feature set
# mirrors atlas-acp so Cargo unifies to one build and the wire shapes match.
agent-client-protocol = { version = "1.2", features = ["unstable"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
parking_lot = "0.12"
tracing = "0.1"
async-trait = "0.1"

[target.'cfg(unix)'.dependencies]
# Process-group kill for the cancellable Bash tool (SIGKILL to -pgid so a
# Stop reaps the whole command tree, not just the `sh -c` shell).
libc = "0.2"

[dev-dependencies]
# Direct dev-dep ONLY for tests/utf8_patch_guard.rs: referencing
# cersei_provider::utf8::ATLAS_UTF8_PATCH fails to compile if the
# [patch.crates-io] vendor override below stops applying.
cersei-provider = "0.2.6"

[patch.crates-io]
# ATLAS PATCH (Phase 0, plans/atlas-agent-stack-zed-parity.md): incremental
# UTF-8 decoding in the SSE stream decoders — the published crate corrupts
# multi-byte chars split across HTTP chunk boundaries (from_utf8_lossy on raw
# chunks). Guard: cersei_provider::utf8::ATLAS_UTF8_PATCH.
cersei-provider = { path = "../../vendor/cersei-provider" }
# Phase 2: cersei-agent vendored for the tool-cancel race fix — the published
# runner never raced tool.execute() against the cancel token (writes landed
# after Stop) and left orphaned tool_use blocks in provider history on cancel.
# Guard: cersei_agent::ATLAS_CANCEL_PATCH.
cersei-agent = { path = "../../vendor/cersei-agent" }
