[package]
name = "atlas-checkpoint"
version = "0.1.0"
edition = "2021"
description = "Atlas's agent-session record: local SQLite store, redact-on-write capture, git commit linkage, transcript import, and the sync outbox. Tauri-free so the whole surface is testable against a real database and a real git repository."

[lib]
name = "atlas_checkpoint"

[dependencies]
# The store. Bundled so the database is self-contained and does not depend on a
# system sqlite — the same reason src-tauri already bundles it for the Codex
# history reader.
# Pinned to rusqlite 0.39 because its `libsqlite3-sys` is 0.37, the major the
# ported Codex engine pins; `links = "sqlite3"` admits exactly one. Full
# rationale — and the reason 0.38 and 0.40 are both wrong — lives on the same
# declaration in `crates/atlas-thread-metadata/Cargo.toml`. Issue #39.
rusqlite = { version = "0.39", features = ["bundled"] }
# Redaction runs before persistence, so this is a hard dependency of the write
# path rather than of the upload path.
atlas-redact = { path = "../atlas-redact" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
tracing = "0.1"
# The drain is the only networked part of this crate. `blocking` because it runs
# on the capture worker's own thread, and rustls rather than native-tls for the
# same reason the app does: the macOS Security.framework path fails silently in
# sandboxed release builds.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "blocking",
    "rustls-tls",
] }

[dev-dependencies]
tempfile = "3"

# The workspace lint table is only real for members that opt in —
# without this stanza it is dead configuration (#60).
[lints]
workspace = true
