[package]
name = "atlas-codeindex"
version = "0.1.0"
edition = "2021"
description = "Deterministic codebase scanner for Atlas: turns live source into structural, embeddable docs via its own tree-sitter code intelligence."

[lib]
name = "atlas_codeindex"

[dependencies]
# Tree-sitter code intelligence (imports + symbols for Rust/TS/JS/Python/Go).
# Atlas owns this outright (see src/code_intel.rs) — these are the upstream
# grammars, not an SDK wrapper around them.
tree-sitter = "0.26"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
# gitignore-respecting project walk (same crate the file index uses).
ignore = "0.4"
# Content fingerprints for incremental rebuilds.
sha2 = "0.10"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
