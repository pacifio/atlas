[package]
name = "atlas-codeindex"
version = "0.2.0"
edition = "2021"
description = "Atlas code index: parallel tree-sitter symbol extraction into a per-project SQLite + FTS5 index, updated per file."

[lib]
name = "atlas_codeindex"

[dependencies]
# Compact output, cancel tokens and the grep-annotation seam the index fills.
atlas-search = { path = "../atlas-search" }
# Tree-sitter extraction (Rust, TS/TSX/JS, Python, Go). One core in the graph
# (root Cargo.toml), grammars bound through `tree-sitter-language`.
tree-sitter = { workspace = true }
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
# gitignore-respecting discovery (same crate the file index uses).
ignore = { workspace = true }
# Parallel extraction with a thread-local parser.
rayon = { workspace = true }
# Content fingerprints behind the stat gate.
blake3 = { workspace = true }
dunce = { workspace = true }
thiserror = { workspace = true }
# The one SQLite in the graph (FTS5 compiled in); same version and features as
# `crates/atlas-thread-metadata`.
rusqlite = { version = "0.39", features = ["bundled"] }
# `git diff -U0` for impact_of_diff, through the git spawn chokepoint.
atlas-git = { path = "../atlas-git" }
# `cargo metadata` for the Rust crate graph, through the no-console spawn.
atlas-process = { path = "../atlas-process" }
# Cargo metadata, tsconfig/package.json and graph stats.
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# Cargo.toml manifests when `cargo metadata` is unavailable.
toml = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# examples/eval_edges.rs: compare call edges with rust-analyzer's SCIP index.
# `scip` 0.10 pins `protobuf = "=3.7.2"`; the direct dependency is only for
# its `Message` trait and resolves to the same version.
scip = "0.10"
protobuf = "3"

# The workspace lint table is only real for members that opt in —
# without this stanza it is dead configuration (#60).
[lints]
workspace = true
