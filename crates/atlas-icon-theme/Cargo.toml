[package]
name = "atlas-icon-theme"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
# `~/.config/atlas` vs `~/.config/atlas-dev`: whose config this process owns.
atlas-profile = { path = "../atlas-profile" }
dirs = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Already in the tree: `atlas-agent-store` reads zips with the same major, so
# this adds no new crate to the dependency graph. A `.vsix` is a plain zip.
zip = "8"

[dev-dependencies]
tempfile = { workspace = true }
