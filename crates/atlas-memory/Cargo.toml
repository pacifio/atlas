[package]
name = "atlas-memory"
version = "0.1.0"
edition = "2021"
description = "Atlas's on-device RAG/memory engine: MiniLM → usearch HNSW behind the MemorySearchFn seam, plus the shared-memory record store."

[lib]
name = "atlas_memory"

[dependencies]
# `.atlas` vs `.atlas-dev`: whose data this process owns (see that crate).
atlas-profile = { path = "../atlas-profile" }
# The memdir date headers (session rendering, legacy memdir import).
chrono = { version = "0.4", features = ["serde"] }
# `embedding::EmbeddingError`.
thiserror = "2"
# The persistent HNSW vector index — has native save/load/remove (hard deletes).
# Without its default `numkong` SIMD backend here; it's turned back on for every
# target but Windows below. numkong 7.x does not build with MSVC on Windows
# ARM64 (its headers pull in x86-only `<immintrin.h>` and include
# `<processthreadsapi.h>` without `<windows.h>`), and usearch falls back to its
# own distance kernels (`USEARCH_USE_NUMKONG=0`) with the same Rust API.
usearch = { version = "2.25.3", default-features = false }
# On-device MiniLM embedder (384-d, CPU). The `MiniLmProvider` wraps this.
atlas-embed = { path = "../atlas-embed" }

# The shared-memory record store (`record`): one WAL database per scope.
# Pinned to the one rusqlite the workspace resolves — the canonical statement of
# the pin and why is in `crates/atlas-thread-metadata/Cargo.toml` (#39).
rusqlite = { version = "0.39", features = ["bundled"] }
# Every record-store write is scrubbed through Atlas's one redactor.
atlas-redact = { path = "../atlas-redact" }
# Normalised content hash of an entry (its identity when no key is given).
sha2 = "0.10"

async-trait = "0.1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync"] }
tracing = "0.1"

# usearch's numkong SIMD backend everywhere it builds (see `usearch` above).
[target.'cfg(not(windows))'.dependencies]
usearch = { version = "2.25.3", features = ["numkong"] }

[dev-dependencies]
# Unique temp dirs in the record-store tests.
uuid = { version = "1", features = ["v4"] }
# `#[tokio::test]` and `Runtime::new` in the tests (grafeo used to pull these
# features in).
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"

# The workspace lint table is only real for members that opt in —
# without this stanza it is dead configuration (#60).
[lints]
workspace = true
