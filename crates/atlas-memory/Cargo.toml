[package]
name = "atlas-memory"
version = "0.1.0"
edition = "2021"
description = "Atlas's on-device RAG/memory engine: MiniLM → usearch HNSW + grafeo graph memory, behind the MemorySearchFn seam."

[lib]
name = "atlas_memory"

[dependencies]
# Embedded graph database behind `graph::GraphMemory` (relationships, topic
# tags). The `lpg` feature is what provides the actual graph store — without it
# `GrafeoDB::open` panics with "no graph store available". `lpg` already implies
# gql + storage (wal/grafeo-file).
grafeo = { version = "0.5", default-features = false, features = ["lpg", "gql", "grafeo-file", "wal"] }
# Timestamps on graph nodes + the memdir date headers.
chrono = { version = "0.4", features = ["serde"] }
# Memory-node ids.
uuid = { version = "1", features = ["v4"] }
# `embedding::EmbeddingError`.
thiserror = "2"
# The persistent HNSW vector index — has native save/load/remove (hard deletes).
usearch = "2.25.3"
# On-device MiniLM embedder (384-d, CPU). The `MiniLmProvider` wraps this.
atlas-embed = { path = "../atlas-embed" }

async-trait = "0.1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync"] }
tracing = "0.1"
