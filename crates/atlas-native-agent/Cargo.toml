[package]
name = "atlas-native-agent"
version = "0.1.0"
edition = "2021"
description = "Atlas Agent — the native agent — on the ported AgentConnection seam."

# Integration tests are declared, not auto-discovered. Cargo builds every
# `tests/*.rs` it finds, which means a stale file left behind by a deletion is a
# build failure rather than dead weight — and the two below are the whole suite.
autotests = false

[lib]
name = "atlas_native_agent"

[[test]]
name = "engine_turn"
path = "tests/engine_turn.rs"

[[test]]
name = "engine_gateway_turn"
path = "tests/engine_gateway_turn.rs"

[dependencies]
# The seam. Same exact pin as every other crate in the ported stack
# (`zed-ref/Cargo.toml:518`).
agent-client-protocol = { version = "=2.0.0", features = ["unstable"] }
atlas-acp-thread = { path = "../atlas-acp-thread" }
# For the `AgentServer` trait: the native agent occupies the same slot an
# external one does, exactly as Zed's `NativeAgentServer` does.
atlas-agent-servers = { path = "../atlas-agent-servers" }
anyhow = "1"
futures = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1"

# --- The ported engine (#45, ADR-0004) --------------------------------------
# No longer optional. These sat behind the `ported-engine` feature so the Cersei
# path could keep shipping while the port was proved; that path is gone (#54),
# so gating them would gate the whole crate.
base64 = { version = "0.22" }
serde = { version = "1", features = ["derive"] }
toml = { version = "0.9" }
codex-app-server = { path = "../../vendor/codex/app-server" }
codex-app-server-client = { path = "../../vendor/codex/app-server-client" }
codex-app-server-protocol = { path = "../../vendor/codex/app-server-protocol" }
codex-arg0 = { path = "../../vendor/codex/arg0" }
codex-config = { path = "../../vendor/codex/config" }
codex-core = { path = "../../vendor/codex/core" }
codex-exec-server = { path = "../../vendor/codex/exec-server" }
codex-feedback = { path = "../../vendor/codex/feedback" }
codex-login = { path = "../../vendor/codex/login" }
# For the engine's bundled base prompt, which the authored catalogue (D3) uses as
# every row's `instructions_template`.
codex-models-manager = { path = "../../vendor/codex/models-manager" }
codex-protocol = { path = "../../vendor/codex/protocol" }
codex-rollout = { path = "../../vendor/codex/rollout" }

[dev-dependencies]
async-trait = "0.1"
# The live thread feed's own predicate, so the history test asserts "the
# recorder will fire" rather than guessing which events matter.
atlas-thread-metadata = { path = "../atlas-thread-metadata" }
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
# Seam-1 contract tests drive a real turn against a local mock model, so the
# streaming path is exercised without a live provider or a credential.
wiremock = "0.6"
