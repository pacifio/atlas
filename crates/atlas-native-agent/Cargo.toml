[package]
name = "atlas-native-agent"
version = "0.1.0"
edition = "2021"
description = "Cersei, Atlas's in-process agent, on the ported AgentConnection seam."

[lib]
name = "atlas_native_agent"

[dependencies]
# The seam. Same exact pin as every other crate in the ported stack
# (`zed-ref/Cargo.toml:518`).
agent-client-protocol = { version = "=2.0.0", features = ["unstable"] }
atlas-acp-thread = { path = "../atlas-acp-thread" }
# For the `AgentServer` trait: the native agent occupies the same slot an
# external one does, exactly as Zed's `NativeAgentServer` does.
atlas-agent-servers = { path = "../atlas-agent-servers" }
# The runtime itself. It names no protocol version — that is what makes it
# linkable from here as well as from the old stack; see `atlas_cersei::events`.
atlas-cersei = { path = "../atlas-cersei" }
anyhow = "1"
futures = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1"

# --- The ported engine (#45, ADR-0004) --------------------------------------
# Optional, and off by default: the `ported-engine` feature is the development
# -time switch of spec Phase 2. With it off, this crate resolves exactly as it
# did before the port and the shipped app is untouched.
base64 = { version = "0.22", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
toml = { version = "0.9", optional = true }
codex-app-server-client = { path = "../../vendor/codex/app-server-client", optional = true }
codex-app-server-protocol = { path = "../../vendor/codex/app-server-protocol", optional = true }
codex-arg0 = { path = "../../vendor/codex/arg0", optional = true }
codex-config = { path = "../../vendor/codex/config", optional = true }
codex-core = { path = "../../vendor/codex/core", optional = true }
codex-exec-server = { path = "../../vendor/codex/exec-server", optional = true }
codex-feedback = { path = "../../vendor/codex/feedback", optional = true }
codex-login = { path = "../../vendor/codex/login", optional = true }
codex-protocol = { path = "../../vendor/codex/protocol", optional = true }
codex-rollout = { path = "../../vendor/codex/rollout", optional = true }

[features]
default = []
ported-engine = [
  "dep:base64",
  "dep:serde",
  "dep:toml",
  "dep:codex-app-server-client",
  "dep:codex-app-server-protocol",
  "dep:codex-arg0",
  "dep:codex-config",
  "dep:codex-core",
  "dep:codex-exec-server",
  "dep:codex-feedback",
  "dep:codex-login",
  "dep:codex-protocol",
  "dep:codex-rollout",
]

[dev-dependencies]
# `test-support` lets a test point a real turn at a scripted model, which is the
# only part of the native agent a test cannot otherwise run.
atlas-cersei = { path = "../atlas-cersei", features = ["test-support"] }
async-trait = "0.1"
cersei = { version = "0.2.6", default-features = false }
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }

# The vendored Cersei SDK patch forks this crate's SDK reach requires
# (`cersei-provider` UTF-8, `cersei-agent` cancel) live in the root
# `Cargo.toml`'s `[patch.crates-io]` — honored there and nowhere else once the
# repo became a workspace (issue #38 / spec D4).
