[package]
name = "atlas-native-agent"
version = "0.1.0"
edition = "2021"
description = "Cersei, Atlas's in-process agent, on the ported AgentConnection seam."

[lib]
name = "atlas_native_agent"

[dependencies]
# The seam. Same exact pin as every other crate in the ported stack
# (`zed-ref/Cargo.toml:518`).
agent-client-protocol = { version = "=2.0.0", features = ["unstable"] }
atlas-acp-thread = { path = "../atlas-acp-thread" }
# For the `AgentServer` trait: the native agent occupies the same slot an
# external one does, exactly as Zed's `NativeAgentServer` does.
atlas-agent-servers = { path = "../atlas-agent-servers" }
# The runtime itself. It names no protocol version — that is what makes it
# linkable from here as well as from the old stack; see `atlas_cersei::events`.
atlas-cersei = { path = "../atlas-cersei" }
anyhow = "1"
futures = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
# `test-support` lets a test point a real turn at a scripted model, which is the
# only part of the native agent a test cannot otherwise run.
atlas-cersei = { path = "../atlas-cersei", features = ["test-support"] }
async-trait = "0.1"
cersei = { version = "0.2.6", default-features = false }
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }

# The vendored Cersei SDK patch forks this crate's SDK reach requires
# (`cersei-provider` UTF-8, `cersei-agent` cancel) live in the root
# `Cargo.toml`'s `[patch.crates-io]` — honored there and nowhere else once the
# repo became a workspace (issue #38 / spec D4).
