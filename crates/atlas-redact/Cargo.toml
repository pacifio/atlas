[package]
name = "atlas-redact"
version = "0.1.0"
edition = "2021"
description = "Atlas's single source of truth for secret redaction: layered scrubbing (Shannon entropy, vendored betterleaks rules, provider prefixes, credentialed URIs, connection strings, bounded credential key/value) with JSON-aware traversal. String in, redacted string out — no I/O, no async."

[lib]
name = "atlas_redact"

[dependencies]
regex = "1"
# JSON-aware redaction walks parsed values so structural fields survive; agent
# transcripts are JSON-shaped and a redactor that mangles the envelope makes the
# transcript unreadable.
serde_json = "1"

# The workspace lint table is only real for members that opt in —
# without this stanza it is dead configuration (#60).
[lints]
workspace = true
