[package]
name = "atlas-registry"
version = "0.1.0"
edition = "2021"

[dependencies]
atlas-acp = { path = "../atlas-acp" }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "gzip",
    "stream",
] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = "8"
flate2 = "1"
tar = "0.4"
thiserror = "2"
tracing = "0.1"
base64 = "0.21"
parking_lot = "0.12"
dashmap = "6"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"

[dev-dependencies]
tempfile = "3"
