[package]
name = "atlas-security"
version = "0.1.0"
edition = "2021"
description = "The Atlas Security Agent's scanner (ATL-985): reads a Checkpoint's commit, maps the diff to risk, and runs local secret, sink and dependency rules. Tauri-free."

[lib]
name = "atlas_security"

# `cargo run -p atlas-security --features eval --bin security-eval -- local`.
# Never built into the app: the app depends on the library only.
[[bin]]
name = "security-eval"
required-features = ["eval"]

[features]
eval = ["dep:tokio", "dep:atlas-profile"]

[dependencies]
atlas-checkpoint = { path = "../atlas-checkpoint" }
# The harness binary only: where a Project keeps its `.atlas/` (dev profile aware).
atlas-profile = { path = "../atlas-profile", optional = true }
atlas-redact = { path = "../atlas-redact" }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"
zip = "9.1"
# The harness binary only: its HTTP calls to Workers AI.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"], optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }

# The workspace lint table is only real for members that opt in —
# without this stanza it is dead configuration (#60).
[lints]
workspace = true
