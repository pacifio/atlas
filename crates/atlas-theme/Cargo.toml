[package]
name = "atlas-theme"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
# `~/.config/atlas` vs `~/.config/atlas-dev`: whose config this process owns.
atlas-profile = { path = "../atlas-profile" }
dirs = { workspace = true }
notify = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
