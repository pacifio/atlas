# ── Agents and indicators ─────────────────────────────────────────────────────

[[key]]
name = "agent.chip.foreground"
group = "Agents and indicators"
description = "Agent identity chip text."
base = "foreground"
dark = "#ffffff"
light = "#575279"
note = """
Two keys, not eighteen. There WAS one pair per vendor — and eight of those
named agents that do not exist, while three more were overridden by hardcoded
CSS. ADR-0002 forbids privileging an agent, and the installed set is discovered
at runtime, so a theme author cannot enumerate it in the first place. The
vendors' own brand hues are now plain constants beside `agentMeta()`; this pair
is the neutral chip every identity falls back to, which is what lets a
monochrome theme flatten the lot.
"""

[[key]]
name = "agent.chip.background"
group = "Agents and indicators"
description = "Agent identity chip fill."
base = "foreground"
op = "alpha"
amount = 0.06
dark = "rgba(255,255,255,0.06)"
light = "rgba(0,0,0,0.06)"


# ── Identity hues ─────────────────────────────────────────────────────────────
#
# The `--color-hue-*` utilities (`bg-hue-orange`, `Tag`, `HueDot`) read these.
# They used to borrow other roles — orange was `syntax.number`, pink was
# `syntax.escape`, the rest the ANSI slots — and a theme that coloured those
# roles for code (Atlas's own syntax is Pierre's, where numbers are cyan) turned
# an "orange" label cyan. A hue now reads the theme's own palette hue of the same
# name, so it is whatever that theme means by orange, and a theme that wants a
# different chip colour from its palette sets the key. The defaults, for a
# theme that writes no palette, are the Atlas theme's chips: its palette,
# except dark yellow, where the palette has a terminal's pure #ffff00 and the
# Atlas theme pins a label yellow (see themes/atlas.toml).

[[key]]
name = "hue.red"
group = "Identity hues"
description = "The red identity hue: labels, project dots, meters."
palette = "red"
dark = "#f44747"
light = "#c62828"

[[key]]
