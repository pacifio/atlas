# The theme-key registry — the one hand-edited source for every Atlas theme key,
# and for how every shadcn base token a theme leaves out is derived (ADR-0022).
#
# This file lives in @tryatlas/design (ADR-0027); desktop copies it into
# crates/atlas-theme/ verbatim. Edit it there, never in a copy.
#
# GENERATED FROM THIS FILE in the package (never edit those by hand; run
# `bun run theme`):
#
#   src/theme/theme-key-registry.ts   the TS registry the resolver reads
#   theme-rules/theme-keys.txt        the key list + descriptions Rust reads
#   theme-rules/base-rules.txt        the `[[base]]` rules, which Rust's
#                                     interpreter runs for import and export
#   src/styles/themes.css             every built-in theme, resolved
#
# Desktop generates the rest from its copy: the JSON Schema's `keys` property
# (so `#:schema` gives authors completion) and the table in
# docs/reference/theme-keys.md.
#
# `bun run theme:check` (and `bun run test`) fail when any of them is stale.
#
# ── An entry ──────────────────────────────────────────────────────────────────
#
#   name         the dotted role name an author writes under `[dark.keys]`.
#   group        heading this key sits under in the generated outputs. Keys of a
#                group must be contiguous.
#   description  one line, what this key colours. Shown on hover in a TOML editor.
#   palette      first derivation source: one of the eight palette hues.
#   base         second derivation source: a shadcn base token.
#   op/amount    the transform applied to whichever source was chosen. Omit for a
#                plain alias.
#   dark/light   the Atlas default for each appearance, used when a theme sets
#                neither the key nor any source it derives from.
#   note         optional prose, carried into the generated TS as a comment.
#
# Resolution order, implemented once in `resolve-theme.ts`: an explicit `keys`
# value in the theme wins; then `palette`; then `base`; then the appearance
# default. `op` is applied to whichever of those three was used — never to an
# explicit value, which is taken exactly as written.
#
# ── The operation vocabulary (closed; adding one means editing the resolver) ──
#
#   alpha              replace the colour's alpha channel with `amount`.
#   toward_background  mix `amount` of `base.background` into the colour. Keeps a
#                      muted role muted on a light theme, where lightening would
#                      wash it out.
#   toward_foreground  mix `amount` of `base.foreground` into the colour — the
#                      mirror of the above. This is what "a stronger version of
#                      this colour" means in BOTH appearances: on a dark variant
#                      the foreground is pale so it lightens, on a light variant
#                      it is dark so it darkens. Reach for this, not `lighten`.
#   readable           whichever of `base.foreground` and `base.background` has
#                      the higher WCAG contrast against the colour: the text for
#                      a filled surface (`primary-foreground` on a pale primary
#                      in a dark theme is the dark background). Takes no amount.
#   lighten            mix `amount` of literal white into the colour. Appearance
#                      BLIND, so it is only correct where "paler" is the literal
#                      intent whatever the background — which, after the light
#                      pass, is one key (`terminal.ansi.bright_white`). A hover
#                      or a bright ANSI slot used to use it and went PALER on a
#                      light theme, i.e. away from the reader.
#
# Every mix is in OKLab (`color.ts`, `color.rs`), so it moves lightness evenly
# and keeps the hue.
#
# Deleting a key, renaming one, or changing what it derives from is an edit to
# this file and nothing else.
#
# ── `[[derived]]`: a colour Atlas writes but no theme may set ─────────────────
#
# Some `--atlas-…` variables the app reads are not judgement calls. A status
# BADGE fill is its status FOREGROUND at 12% — an author who wants a different
# green wants a different green, not two greens that must be kept in step. So
# those live here instead of as keys: Atlas resolves them to exactly the value
# a key would have produced, and they are absent from `theme-keys.txt` and from
# the JSON Schema, so writing one in a theme file is an unknown-key warning.
#
#   name/description  as for a key.
#   from              the settable key this transforms, OR
#   base              the shadcn base token it transforms. Exactly one of the two.
#   op/amount         required — a derived variable with no transform would be
#                     an alias, and an alias should just be the key itself.
#
# Reach for this when a colour is a FUNCTION of a key. Anything a theme author
# would genuinely want to set independently is a key, however small.
#
# ── `[[base]]`: how a shadcn base token a theme leaves out is derived ────────
#
# No base token is required (ADR-0022). `background`, `foreground` and
# `primary` are the seeds; everything else follows from them by the rules
# below, which use the same fields and the same resolution order as a key —
# an explicit value wins, then `palette`, then `base`, then the default — with
# `base` naming another base token. Rules are in `BASE_TOKENS` order, and a
# rule's `base` must be an earlier rule, so one pass resolves them all.
# `dark`/`light` are required only where nothing else can answer.
#
# A built-in or imported theme pins its values, so a change here moves only
# the themes that left a token out. The amounts were fitted, in OKLab, to the
# median of the fifteen built-in themes' hand-written values.

version = 1


