#:schema ../schema/theme-v1.json
schema = 1
id = "atlas-mono"
name = "Atlas Mono"
author = "Atlas contributors"
license = "Apache-2.0"

[dark.base]
"background" = "#000000"
"foreground" = "#d0d0d0"
"card" = "#1a1a1a"
"card-foreground" = "#d0d0d0"
"popover" = "#2d2d2d"
"popover-foreground" = "#d0d0d0"
"primary" = "#ffff00"
"primary-foreground" = "#000000"
"secondary" = "#1a1a1a"
"secondary-foreground" = "#8a8a8a"
"muted" = "#1a1a1a"
"muted-foreground" = "#8a8a8a"
"accent" = "#1a1a1a"
"accent-foreground" = "#d0d0d0"
"destructive" = "#b0b0b0"
"destructive-foreground" = "#000000"
"border" = "#2a2a2a"
"input" = "#2a2a2a"
"ring" = "#ffff00"
"chart-1" = "#ffff00"
"chart-2" = "#e6e6e6"
"chart-3" = "#c2c2c2"
"chart-4" = "#a8a8a8"
"chart-5" = "#8a8a8a"
"sidebar" = "#000000"
"sidebar-foreground" = "#d0d0d0"
"sidebar-primary" = "#ffff00"
"sidebar-primary-foreground" = "#000000"
"sidebar-accent" = "#1a1a1a"
"sidebar-accent-foreground" = "#d0d0d0"
"sidebar-border" = "#1a1a1a"
"sidebar-ring" = "#ffff00"
"radius" = "8px"
"tracking-normal" = "0em"
"spacing" = "0.25rem"
"shadow-2xs" = "0 1px 2px rgba(0, 0, 0, 0.35)"
"shadow-xs" = "0 1px 2px rgba(0, 0, 0, 0.45)"
"shadow-sm" = "0 1px 3px rgba(0, 0, 0, 0.55)"
"shadow-md" = "0 4px 12px rgba(0, 0, 0, 0.65)"
"shadow-lg" = "0 8px 24px rgba(0, 0, 0, 0.75)"
"shadow-xl" = "0 12px 36px rgba(0, 0, 0, 0.82)"
"shadow-2xl" = "0 16px 48px rgba(0, 0, 0, 0.9)"

[dark.palette]
red = "#b0b0b0"
orange = "#c2c2c2"
yellow = "#d4d4d4"
green = "#b0b0b0"
cyan = "#9c9c9c"
blue = "#a8a8a8"
purple = "#e6e6e6"
pink = "#b0b0b0"

[dark.keys]
"border.subtle" = "#1a1a1a"
"border.strong" = "#3d3d3d"
"panel.background" = "#000000"
"panel.input.background" = "#000000"
"editor.background" = "#000000"
"editor.foreground" = "#d0d0d0"
"editor.caret" = "#d0d0d0"
"editor.gutter.background" = "#000000"
"editor.gutter.foreground" = "#666666"
"editor.active_line.background" = "#ffffff0a"
"editor.active_line.gutter_foreground" = "#d0d0d0"
"editor.selection.background" = "#303030"
"editor.match_bracket.background" = "#2d2d2d"
"editor.match_bracket.border" = "#3d3d3d"
"syntax.comment" = "#8a8a8a"
"syntax.keyword" = "#e6e6e6"
"syntax.string" = "#b0b0b0"
"syntax.number" = "#c2c2c2"
"syntax.type" = "#d4d4d4"
"syntax.function" = "#ffff00"
"syntax.variable" = "#ffffff"
"syntax.operator" = "#9c9c9c"
"syntax.tag" = "#d4d4d4"
"syntax.attribute" = "#a8a8a8"
"syntax.constant" = "#c2c2c2"
"syntax.regexp" = "#b0b0b0"
"syntax.escape" = "#b0b0b0"
"syntax.definition" = "#ffffff"
"syntax.property" = "#c8c8c8"
"diff.added.background" = "#0d2211"
"diff.removed.background" = "#220d0d"
"diff.context.background" = "#0a0a0a"


[light.base]
"background" = "#ffffff"
"foreground" = "#2e2e2e"
"card" = "#f4f4f4"
"card-foreground" = "#2e2e2e"
"popover" = "#ebebeb"
"popover-foreground" = "#2e2e2e"
"primary" = "#8a7500"
"primary-foreground" = "#ffffff"
"secondary" = "#f4f4f4"
"secondary-foreground" = "#6b6b6b"
"muted" = "#f4f4f4"
"muted-foreground" = "#6b6b6b"
"accent" = "#f4f4f4"
"accent-foreground" = "#2e2e2e"
"destructive" = "#545454"
"destructive-foreground" = "#ffffff"
"border" = "#dcdcdc"
"input" = "#dcdcdc"
"ring" = "#8a7500"
"chart-1" = "#8a7500"
"chart-2" = "#1f1f1f"
"chart-3" = "#4a4a4a"
"chart-4" = "#767676"
"chart-5" = "#a2a2a2"
"sidebar" = "#ffffff"
"sidebar-foreground" = "#2e2e2e"
"sidebar-primary" = "#8a7500"
"sidebar-primary-foreground" = "#ffffff"
"sidebar-accent" = "#f4f4f4"
"sidebar-accent-foreground" = "#2e2e2e"
"sidebar-border" = "#f4f4f4"
"sidebar-ring" = "#8a7500"
"radius" = "8px"
"tracking-normal" = "0em"
"spacing" = "0.25rem"
"shadow-2xs" = "0 1px 2px rgba(46, 46, 46, 0.05)"
"shadow-xs" = "0 1px 2px rgba(46, 46, 46, 0.07)"
"shadow-sm" = "0 1px 3px rgba(46, 46, 46, 0.09)"
"shadow-md" = "0 4px 12px rgba(46, 46, 46, 0.12)"
"shadow-lg" = "0 8px 24px rgba(46, 46, 46, 0.15)"
"shadow-xl" = "0 12px 36px rgba(46, 46, 46, 0.19)"
"shadow-2xl" = "0 16px 48px rgba(46, 46, 46, 0.23)"

[light.palette]
red = "#4f4f4f"
orange = "#3d3d3d"
yellow = "#2b2b2b"
green = "#4f4f4f"
cyan = "#636363"
blue = "#575757"
purple = "#191919"
pink = "#4f4f4f"

[light.keys]
"border.strong" = "#c2c2c2"
"editor.gutter.foreground" = "#8f8f8f"
"editor.selection.background" = "#cfcfcf"
"editor.match_bracket.background" = "#d2d2d2"
"editor.match_bracket.border" = "#c2c2c2"
"syntax.type" = "#2b2b2b"
"syntax.function" = "#8a7500"
"syntax.variable" = "#000000"
"syntax.tag" = "#2b2b2b"
"syntax.attribute" = "#575757"
"syntax.definition" = "#000000"
"syntax.property" = "#373737"
"diff.added.background" = "rgba(47,125,47,0.13)"
"diff.removed.background" = "rgba(190,40,40,0.13)"
"diff.context.background" = "#fafafa"
