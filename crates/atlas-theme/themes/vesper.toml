#:schema ../schema/theme-v1.json
schema = 1
id = "vesper"
name = "Vesper"
author = "Vesper"
license = "MIT"

[dark.base]
"background" = "#101010"
"foreground" = "#ffffff"
"card" = "#1a1a1a"
"card-foreground" = "#ffffff"
"popover" = "#2a2a2a"
"popover-foreground" = "#ffffff"
"primary" = "#ffc799"
"primary-foreground" = "#101010"
"secondary" = "#1a1a1a"
"secondary-foreground" = "#838383"
"muted" = "#1a1a1a"
"muted-foreground" = "#8b8b8b"
"accent" = "#1a1a1a"
"accent-foreground" = "#ffffff"
"destructive" = "#ff8080"
"destructive-foreground" = "#101010"
"border" = "#2a2a2a"
"input" = "#2a2a2a"
"ring" = "#ffc799"
"chart-1" = "#ffc799"
"chart-2" = "#99ffe4"
"chart-3" = "#ff8080"
"chart-4" = "#e0e0e0"
"chart-5" = "#8b8b8b"
"sidebar" = "#101010"
"sidebar-foreground" = "#ffffff"
"sidebar-primary" = "#ffc799"
"sidebar-primary-foreground" = "#101010"
"sidebar-accent" = "#1a1a1a"
"sidebar-accent-foreground" = "#ffffff"
"sidebar-border" = "#1a1a1a"
"sidebar-ring" = "#ffc799"
"radius" = "8px"
"tracking-normal" = "0em"
"spacing" = "0.25rem"
"shadow-2xs" = "0 1px 2px rgba(0, 0, 0, 0.35)"
"shadow-xs" = "0 1px 2px rgba(0, 0, 0, 0.45)"
"shadow-sm" = "0 1px 3px rgba(0, 0, 0, 0.55)"
"shadow-md" = "0 4px 12px rgba(0, 0, 0, 0.65)"
"shadow-lg" = "0 8px 24px rgba(0, 0, 0, 0.75)"
"shadow-xl" = "0 12px 36px rgba(0, 0, 0, 0.82)"
"shadow-2xl" = "0 16px 48px rgba(0, 0, 0, 0.9)"

[dark.palette]
red = "#ff8080"
orange = "#ffc799"
yellow = "#ffcfa8"
green = "#99ffe4"
cyan = "#99ffe4"
blue = "#a0a0a0"
purple = "#a0a0a0"
pink = "#ff8080"

[dark.keys]
"border.subtle" = "#1a1a1a"
"border.strong" = "#3a3a3a"
"panel.background" = "#101010"
"panel.input.background" = "#101010"
"editor.background" = "#101010"
"editor.foreground" = "#ffffff"
"editor.caret" = "#ffc799"
"editor.gutter.background" = "#101010"
"editor.gutter.foreground" = "#3a3a3a"
"editor.active_line.background" = "#ffffff0a"
"editor.active_line.gutter_foreground" = "#8b8b8b"
"editor.selection.background" = "rgba(255,255,255,0.13)"
"editor.match_bracket.background" = "#2a2a2a"
"editor.match_bracket.border" = "#3a3a3a"
"syntax.comment" = "#8b8b8b"
"syntax.keyword" = "#a0a0a0"
"syntax.string" = "#99ffe4"
"syntax.number" = "#ffc799"
"syntax.type" = "#ffcfa8"
"syntax.function" = "#ffc799"
"syntax.variable" = "#ffffff"
"syntax.operator" = "#a0a0a0"
"syntax.tag" = "#a0a0a0"
"syntax.attribute" = "#ffc799"
"syntax.constant" = "#ffc799"
"syntax.regexp" = "#99ffe4"
"syntax.escape" = "#99ffe4"
"syntax.definition" = "#ffffff"
"syntax.property" = "#e0e0e0"
"diff.added.background" = "#14261a"
"diff.removed.background" = "#2a1414"
"diff.context.background" = "#0d0d0d"
"diff.added.emphasis" = "rgba(153,255,228,0.24)"
"diff.removed.emphasis" = "rgba(255,120,120,0.30)"

