# Atlas configuration.
#
# Every user-facing Atlas preference lives here. Edit this file by hand or use
# Settings — both write to it, and Atlas picks up external edits live. A change
# takes effect at once unless the key's comment says otherwise.
#
# Your comments, formatting, and any keys Atlas doesn't recognize survive its
# own writes. An invalid value is rejected whole: Atlas keeps running on the
# last settings that loaded cleanly, shows the error in Settings, and leaves
# this file exactly as you wrote it.

# Format version of this file. Atlas manages it; leave it alone.
schemaVersion = 1

[settings]

# Keep Atlas's directory in each opened git project out of version control:
# `.atlas/` goes into the project's .gitignore (created if needed); a dev
# build's `.atlas-dev/` goes into .git/info/exclude. No-op on non-git
# projects. (default: true)
autoAddAtlasGitignore = true

# Record Atlas-internal events (sign-in, agent lifecycle, file and browser
# opens) into the Logs panel. (default: true)
enableAtlasLogs = true

# Show dotfiles and dot-directories in the explorer file tree. (default: true)
showHiddenFiles = true

# The external editor that "Open in <editor>" uses for a file or the project:
# an id such as "vscode", "cursor", "zed", "windsurf", "sublime", "xcode" or a
# JetBrains IDE ("idea", "webstorm", "pycharm"…), or "system" for the app your
# system opens the file with. Empty uses the first editor Atlas finds
# installed. An id that isn't installed falls back to that same choice. Files
# outside the project open in the system's app unless this names an editor.
# (default: "")
preferredEditor = ""

# Interface zoom, where 1.0 is 100%. Also driven by Cmd +/-/0. Must be a
# number between 0.5 and 2.0. (default: 1.0)
uiScale = 1.0

# Anonymous product telemetry. Opt-OUT: on by default, coarse metadata only,
# never file contents or prompts. See TELEMETRY.md. (default: true)
shareTelemetry = true

# Attribute telemetry to your signed-in Atlas account instead of the anonymous
# per-device id. Irrelevant while signed out, or while shareTelemetry is false
# — both gate it. (default: true)
linkTelemetryToAccount = true

# On-device embedding model, named by its directory. Normally managed for you
# by the Local Model Manager. Must not be empty. (default: "all-MiniLM-L6-v2")
embeddingModelId = "all-MiniLM-L6-v2"

# Theme id used while Atlas is light, for the whole app: chrome, editor,
# terminal, diffs and syntax. A theme with no light variant shows its dark
# one. Unknown ids fall back to "atlas" with a warning. (default: "atlas")
themeLight = "atlas"

# Theme id used while Atlas is dark, for the whole app. A theme with no dark
# variant shows its light one. Unknown ids fall back to "atlas" with a
# warning. (default: "atlas")
themeDark = "atlas"

# Exactly "system", "dark" or "light": whether Atlas is light or dark, and so
# which of themeLight and themeDark it uses. (default: "system")
themeMode = "system"

# themeOverrides: Optional user-local patch with base, palette and keys
# tables, applied after the active theme variant. Omitted when empty.
# File and folder icons, on their own track from the color theme. "minimal"
# keeps Atlas's own lucide icons; anything else names a VS Code icon theme,
# bundled or installed from Open VSX. (default: "material-icon-theme")
iconTheme = "material-icon-theme"

# macOS app icon, by id: "dark" (the icon Atlas ships with) or "light". Any
# other than dark replaces the Dock and Finder icon. An id this Atlas does not
# know shows the default. (default: "dark")
appIcon = "dark"

# Next-step suggestion chips in the session's per-turn card. Exactly "agent"
# or "off", nothing else. (default: "agent")
adaptiveSuggestions = "agent"

# What picking another agent does to a session that has a conversation:
# "new-tab" keeps it and opens the new agent in a new tab, "handoff" switches
# in place and attaches it to the next message, "reset" switches in place and
# starts over. (default: "reset")
agentSwitchBehavior = "reset"

# Before switching agents on a chat with a conversation, send the agent being
# left /remember (when it offers that command) and wait for it to save what it
# learned to shared memory. Costs one turn per switch. (default: false)
rememberBeforeSwitch = false

# Inline git blame — a dim author/age/summary annotation trailing the active
# line in the editor. (default: true) A project can override it in its own
# .atlas/config.toml.
gitBlameInline = true

# Quietly `git fetch` the open project when it opens, when Atlas regains
# focus, and every few minutes, so the Pull badge shows what the remote has.
# Never pulls or touches your files. (default: true) A project can turn it
# off, never on, in its own .atlas/config.toml.
gitAutoFetch = true

# Keep the computer awake while an Atlas agent is actively running. Prevents
# idle system sleep; display can still turn off. No effect on Windows.
# (default: false)
keepAwakeWhileRunning = false

# Check for a newer signed Atlas release on startup and prompt when one is
# available. (default: true)
autoUpdate = true

# Let Atlas Agent download the latest curated plugin catalog when it starts —
# a network request at every launch. Applies the next time the agent starts.
# (default: false)
curatedPluginSync = false

# Mirror CLAUDE.md and .claude/rules/ into a marked block of the active
# project's AGENTS.md, kept current as they change, for any agent that reads
# AGENTS.md. Writes into the repository; text outside the block is never
# changed. Off: the block is taken back out. (default: false)
instructionSync = false

# updaterIgnoredVersion: A release you chose to skip in the update prompt.
# Absent unless one was ignored — TOML has no null, so "unset" means the key
# simply isn't here. Delete the line to clear it; never write an empty string.
# Chat composer send gesture. true = Enter sends and Shift+Enter inserts a
# newline; false = only Cmd/Ctrl+Enter sends. Cmd/Ctrl+Enter sends either way.
# (default: true)
enterToSend = true

# Let Atlas Agent act on the window: open files at a line, switch tabs and
# panels, fill in a chat message, type a command for you to run. It never
# switches projects, sends for you or presses Enter. Off: its UI tools are
# withdrawn and every call is refused. (default: true) A project can turn it
# off, never on, in its own .atlas/config.toml.
agentUiNavigation = true

# Let Atlas Agent act in your organization, as you: read the recorded
# sessions, comments, members and conversations of the organization a
# cloud-bound Project belongs to. Anything that reaches another person asks
# you first. Off: its organization tools are withdrawn and every call is
# refused. (default: true) A project can turn it off, never on, in its own
# .atlas/config.toml.
agentOrgAccess = true

# Let agents search this project's code through Atlas: grep for text and find
# files by name, in-process, respecting .gitignore and never reading secret
# files such as .env. Off: the code tools are withdrawn and every call is
# refused; agents use their own shell instead. (default: true) A project can
# turn it off, never on, in its own .atlas/config.toml.
agentCodeTools = true

# Once a day, when there are new sessions, ask the memory model to propose
# changes to shared memory (add, merge, archive, rewrite, link). Proposals
# wait in Memory > Review; nothing is applied without you. Uses the same model
# and consent as extraction. (default: false) A project can turn it off, never
# on, in its own .atlas/config.toml.
memoryDreams = false

# Keep a read-only Agent Memory Repo mirror of each project's active memory,
# as a local git repository outside the project. No remote, nothing is pushed.
# (default: false) A project can turn it off, never on, in its own
# .atlas/config.toml.
memoryRepoMirror = false

# Atlas's shared memory is the only memory in Atlas sessions: agents that keep
# their own memory, such as Claude Code's auto memory, start with it turned
# off. Off: each agent also keeps its own memory files. (default: true)
atlasOnlyMemory = true

# A successful command shorter than this many milliseconds never notifies.
# Must be between 0 and 3600000. (default: 10000)
terminalNotifyMinDurationMs = 10000

# Notifications master switch. Off silences every notification except sign-in
# problems, which always show. (default: true)
notificationsEnabled = true

# OS banner for notifications that need you — a permission request, a
# question, a terminal asking for input. Shown only when you are away.
# (default: true)
notifyNeedsYouNative = true

# Sound for notifications that need you. (default: true)
notifyNeedsYouSound = true

# OS banner when an agent turn or terminal command finishes or fails. Shown
# only when you are away. (default: true)
notifyOutcomeNative = true

# Sound for finished / failed notifications. (default: true)
notifyOutcomeSound = true

# OS banner for warnings — context nearly full, rate limited, retrying, agent
# stopped. (default: false)
notifyWarningNative = false

# Sound for warnings. (default: false)
notifyWarningSound = false

# OS banner for Chat direct messages and @mentions. Shown only when you are
# away. (default: true)
notifyTeamNative = true

# Sound for Chat notifications. (default: true)
notifyTeamSound = true

# Show Allow once / Deny buttons on permission banners. Off: the banner only
# opens the session. (default: true)
notifyPermissionActions = true

# Notification kinds you switched off in Settings > Notifications, by id, e.g.
# ["terminal-done", "git-behind"]. Unknown ids are ignored; a kind that must
# always show (sign-in lost) cannot be silenced. (default: [])
notifyDisabledKinds = []

# An agent turn that finished faster than this many milliseconds stays quiet;
# failures and requests for you are never held back. 0 turns it off. Must be
# between 0 and 3600000. (default: 0)
notifyAgentMinDurationMs = 0

# Models you starred in the composer's model picker, as "agentType:modelId",
# e.g. ["claude-code:opus"]. Starred models open the picker on Favorites.
# Unknown entries are ignored. (default: [])
favoriteModels = []

# Ask before deleting a session from the sidebar or the history. A deleted
# session's transcript stays with its agent, but Atlas forgets the session.
# Settling never asks, because it can be undone. (default: true)
confirmDeleteChat = true

# Ask before quitting while an agent is in the middle of a turn, since
# quitting stops it. Quitting again while the question is open quits anyway.
# (default: true)
confirmQuitWhileRunning = true

# When Atlas quits, crashes or restarts to update while an agent is in the
# middle of a turn, the next launch opens that session and tells the agent to
# continue where it left off, with a row in the transcript saying so. Settled
# and snoozed sessions are left alone, and a turn that keeps getting cut short
# is let go after three tries in a row. (default: true)
continueSessionsAfterRestart = true

# A new session starts on the agent you last picked in a composer, by
# switching or with the agent shortcut, as long as it is still installed. Off,
# or before you have picked one, new sessions start on defaultAgent. (default:
# true)
newSessionUsesLastAgent = true

# The agent a new session starts with: "atlas-agent" for Atlas Agent, or the
# id of an installed ACP agent, such as "claude-code". An agent that isn't
# installed falls back to Atlas Agent. (default: "atlas-agent") A project can
# override it in its own .atlas/config.toml.
defaultAgent = "atlas-agent"

# How wide the conversation and the composer may grow: "normal" (760 pixels),
# "wide" (1080 pixels) or "full" (the whole panel). (default: "normal")
chatWidth = "normal"

# Wrap long lines in file tabs, diffs and a session's code blocks. Off: lines
# keep their shape and scroll sideways. The wrap button in a file's or the
# review diff's header flips this same setting. (default: true)
wordWrap = true

# The order of sessions in the sidebar: "recent" puts the session with the
# latest activity first, "created" the one started most recently. (default:
# "recent")
sidebarSort = "recent"

# Days a session may sit idle before Atlas settles it: moves it to the Settled
# shelf at the bottom of the session sidebar, where it stays listed and
# resumable. A session that is running, waiting for you, pinned, snoozed, or
# that you un-settled since its last activity is left alone, and sending to a
# settled session brings it back. 0 turns auto-settling off; settling by hand
# still works. Must be between 0 and 90. (default: 3)
autoSettleAfterDays = 3

# The clock for every time of day Atlas shows: "12h", "24h", or "system" to
# follow your system's region settings. (default: "system")
timeFormat = "system"

# The font for Atlas's interface and chats, as a CSS font-family list such as
# "Inter, sans-serif". Empty uses the theme's font-sans if it sets one, else
# the system font. A font that isn't installed falls through to the next one
# in the list. (default: "")
uiFontFamily = ""

# The font for the editor, diffs and code in chats, as a CSS font-family list
# such as "JetBrains Mono, monospace". Empty uses the theme's font-mono if it
# sets one, else the platform's monospace font. The terminal uses it too
# unless terminalFontFamily is set. (default: "")
codeFontFamily = ""

# The font for the chat composer, as a CSS font-family list. Empty uses the
# interface font. (default: "")
composerFontFamily = ""

# The terminal's font, as a CSS font-family list. Empty uses the code font. A
# font that isn't fixed-width misaligns columns. (default: "")
terminalFontFamily = ""

# The code editor's font size, in pixels. The interface zoom scales it along
# with everything else. (default: 13)
editorFontSize = 13

# The terminal's font size, in pixels. The interface zoom scales it along with
# everything else. (default: 13)
terminalFontSize = 13

# Leave out changes that are only whitespace in diffs you read: a file's diff,
# a commit, and a chat's changes. Diffs you stage from always show every
# change, since a patch without the whitespace no longer applies. (default:
# false)
diffIgnoreWhitespace = false

# Open a diff, such as your changes or a commit, as a list of its files, each
# collapsed to its header; click a file to expand it. Off: every file starts
# expanded. (default: true)
diffFilesCollapsed = true

# The colours for added and removed lines: "theme" uses the theme's green and
# red, "blue-orange" uses its blue and orange, which stay distinct with
# red-green colour blindness. (default: "theme")
diffPalette = "theme"

# Contrast of borders and secondary text, in percent of what the theme draws.
# Above 100 moves them toward the text colour, below 100 toward the
# background. Applies to every theme, the terminal and charts included.
# (default: 100)
interfaceContrast = 100

# The turn rail: a column of short ticks down the left edge of a session's
# transcript, one per turn. Hovering a tick previews the prompt and the start
# of the reply; clicking it jumps to that turn. Off hides the rail. (default:
# true)
showTurnRail = true

# Settle a session once its linked pull request merges, when the merge came
# after you last worked in the session. A pull request that is closed without
# merging always settles its session. Settled sessions stay listed and
# resumable. (default: true)
autoSettleOnMerge = true

# Auto-settling after days of inactivity (autoSettleAfterDays) leaves a
# session alone while it has a linked pull request. Merging or closing it can
# still settle the session (autoSettleOnMerge). (default: true)
autoSettleKeepPullRequests = true

# When a session watches its pull request (the agent asked to, or you turned
# the watch on), a failing check, a new review or comment, or a conflict with
# the base sends the session's agent an update so it can act. Off: watches
# still track the pull request but never prompt an agent. (default: true)
pullRequestWatchWakes = true

# Open a pull request link from a session, the sidebar or a transcript in
# Atlas's pull request tab when it belongs to the project's repository. Off,
# or a pull request of another repository: it opens in the browser. (default:
# true)
pullRequestLinksOpenInApp = true

# The method a pull request's Merge button starts on: "merge", "squash" or
# "rebase", or "last" for whichever you picked most recently on this device. A
# method the repository doesn't allow falls back to one it does. (default:
# "last") A project can override it in its own .atlas/config.toml.
pullRequestMergeMethod = "last"

# Remove recognized agent credit lines (an agent's Co-Authored-By trailer, a
# "Generated with" footer) from the message of a merge or squash Atlas
# performs, auto-merge included. Human co-authors are kept. Commits already on
# the branch are not rewritten. (default: false) A project can override it in
# its own .atlas/config.toml.
removeAgentCreditsOnMerge = false

# Show the Guide tab on pull requests, where an agent writes a tour of the
# change in reading order, with the calls a maintainer should make. The agent
# reads a checkout of the pull request's head and changes nothing. (default:
# true) A project can override it in its own .atlas/config.toml.
pullRequestGuideEnabled = true

# The agent that writes review guides: "atlas-agent" or an installed ACP
# agent's id, such as "claude-code". Empty uses defaultAgent. An agent that
# isn't installed falls back to Atlas Agent. (default: "") A project can
# override it in its own .atlas/config.toml.
pullRequestGuideAgent = ""

# The model the guide's agent runs on, as that agent names it (the id after
# the colon in favoriteModels). The guide reads the change over many steps, so
# a stronger model helps. Empty keeps the agent's default; a model the agent
# doesn't offer is ignored. (default: "") A project can override it in its own
# .atlas/config.toml.
pullRequestGuideModel = ""

# Your preferences for review guides, added to the guide's prompt: what to
# show first, dwell on or skip, and how long summaries should be. The guide's
# format and its coverage of every changed file stay the same. (default: "") A
# project can override it in its own .atlas/config.toml.
pullRequestGuideInstructions = ""

# Scan each new checkpoint's commit in the background for leaked credentials,
# risky calls and dependencies with known advisories. Runs entirely on this
# machine; only the public advisory lists are downloaded. Results are stored
# with the checkpoint and not shown yet. Commits from before it was turned on
# are not scanned. Off in released builds and on in development builds unless
# this key is set. (default: false)
securityScan = false
