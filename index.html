<!doctype html>
<html lang="en" style="background: var(--atlas-boot-bg, #000)">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Atlas</title>
    <!-- CSP NOTE: this inline <style> is why `src-tauri/tauri.conf.json` sets
         `dangerousDisableAssetCspModification: ["style-src"]`. In a bundled
         build Tauri stamps every inline <style> with a nonce and appends that
         nonce to `style-src`; once a nonce is present browsers IGNORE
         'unsafe-inline', so every stylesheet created at runtime (CodeMirror's
         style-mod, sonner, mermaid, xterm, Tiptap) is refused and editors
         render unstyled. Dev never shows it because Tauri only rewrites HTML it
         serves itself: `devCsp` IS applied (tauri.conf.json), but the file Vite
         serves is never stamped, so no nonce reaches `style-src` and
         'unsafe-inline' keeps working. Keep the exclusion; don't "clean it up".

         What it looks like if it regresses. These are ONE blocked runtime
         stylesheet, not separate bugs: style-mod concatenates @codemirror/view's
         base theme, every EditorView.theme and every HighlightStyle module into
         a single <style> element, so all of it dies together.
           - phrases like "Selection deleted" appear in the composer — that is
             CM's aria-live `.cm-announced` div, normally parked off-screen by
             `position: fixed; top: -10000px`;
           - selecting a line appears to add a blank one: `.cm-layer` and
             `.cm-layer > *` lose `position: absolute`, so drawSelection's
             measured-height rectangles land in the text flow;
           - the code editor loses syntax highlighting (HighlightStyle registers
             through the same styleModule facet);
           - caret, selection tint and placeholder colour go default.
         NOT a signature any more: the composer turning monospace / losing its
         padding. That was the 2026-09 report, before the unlayered
         `.atlas-chat-cm-host` rules in globals.css took over those metrics —
         they load as a <link> and are unaffected, so the composer now keeps its
         font and padding through exactly this failure. Only the code editor
         still leans on the `@layer base` .cm-editor fallback.
         Reproduce without a build: serve `dist/` behind a CSP whose style-src
         carries any nonce alongside 'unsafe-inline'. -->
    <!-- The last theme, replayed BEFORE first paint.
         `tokens.css` has not loaded here and neither has any module, so the
         only thing fast enough is localStorage, written by `applyTheme` on
         every switch (`src/features/theme/apply-theme.ts`). Two things come
         back from it: the seven `--atlas-boot-*` colours the skeleton below
         paints with, and the WHOLE resolved variable map, written into the
         same `<style id="atlas-resolved-theme">` applyTheme later rewrites —
         so React's first render, which lands before the first applyTheme,
         already has every theme key in the right theme. The block's text
         must stay byte-identical to `resolvedThemeCss()` there;
         `apply-theme.test.ts` runs this script to check. A first run, a
         cleared profile or a private window finds nothing and every rule
         falls back to `tokens.css` and the literals below, so this can only
         ever improve the flash — never cause one. -->
    <script>
      (function () {
        try {
          var cached = JSON.parse(localStorage.getItem("atlas:launch-theme") || "null");
          if (!cached) return;
          var root = document.documentElement;
          var set = function (name, value) {
            if (typeof value === "string" && value) root.style.setProperty(name, value);
          };
          set("--atlas-boot-bg", cached.background);
          set("--atlas-boot-chrome", cached.chrome);
          set("--atlas-boot-card", cached.card);
          set("--atlas-boot-line", cached.line);
          set("--atlas-boot-skeleton", cached.skeleton);
          set("--atlas-boot-text", cached.text);
          if (cached.appearance === "light" || cached.appearance === "dark") {
            set("--atlas-boot-scheme", cached.appearance);
            root.classList.toggle("dark", cached.appearance === "dark");
            root.setAttribute("data-theme-appearance", cached.appearance);
          }
          if (typeof cached.id === "string") root.setAttribute("data-theme", cached.id);
          var vars = cached.vars;
          if (!vars || typeof vars !== "object") return;
          var declarations = [];
          for (var name in vars) {
            var value = vars[name];
            // Only a well-formed custom property survives: a corrupt or
            // hand-edited entry must not be able to close the block.
            if (!/^--[A-Za-z0-9-]+$/.test(name) || typeof value !== "string") continue;
            if (/[;{}<\\]/.test(value)) continue;
            declarations.push(name + ":" + value);
          }
          if (!declarations.length) return;
          var style = document.createElement("style");
          style.id = "atlas-resolved-theme";
          style.textContent = "html:root{" + declarations.join(";") + "}";
          document.head.appendChild(style);
        } catch (e) {
          /* a blocked or corrupt store just means the fallbacks below */
        }
      })();
    </script>
    <style>
      /* Opaque base background, matching the native window background set in
         `src-tauri/src/lib.rs` (which reads the same persisted theme), so
         nothing white shows before the stylesheets load. The literals are the
         Atlas-dark values and act as the never-cached fallback; the custom
         properties come from the script above. */
      html, body, #root {
        background: var(--atlas-boot-bg, #000);
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
        color-scheme: var(--atlas-boot-scheme, dark);
      }

      /* ── Boot skeleton ────────────────────────────────────────────────
         Mirrors the default Atlas layout (titlebar + 220px chat sidebar +
         chat content + bottom input bar) so cold-start feels like the
         app is already there. Replaced atomically when ReactDOM.createRoot
         commits its first render.
      */
      .atlas-boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        background: var(--atlas-boot-bg, #050505);
        color: var(--atlas-boot-text, rgba(255, 255, 255, 0.3));
        font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
        font-size: 11px;
        user-select: none;
        -webkit-user-select: none;
      }
      .atlas-boot-titlebar {
        height: 29px;
        flex-shrink: 0;
        border-bottom: 1px solid var(--atlas-boot-line, rgba(255, 255, 255, 0.05));
        background: var(--atlas-boot-chrome, #0a0a0a);
      }
      .atlas-boot-body {
        flex: 1;
        display: flex;
        min-height: 0;
      }
      .atlas-boot-sidebar {
        width: 220px;
        flex-shrink: 0;
        border-right: 1px solid var(--atlas-boot-line, rgba(255, 255, 255, 0.05));
        background: var(--atlas-boot-chrome, #080808);
        padding: 8px 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .atlas-boot-search {
        height: 24px;
        border-radius: 6px;
        background: var(--atlas-boot-skeleton, rgba(255, 255, 255, 0.03));
      }
      .atlas-boot-row {
        height: 14px;
        border-radius: 4px;
        background: var(--atlas-boot-skeleton, rgba(255, 255, 255, 0.04));
      }
      .atlas-boot-row.atlas-boot-row-tall { height: 24px; }
      .atlas-boot-row.atlas-boot-row-narrow { width: 55%; }
      .atlas-boot-row.atlas-boot-row-mid    { width: 75%; }
      .atlas-boot-row.atlas-boot-row-wide   { width: 90%; }
      .atlas-boot-main {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .atlas-boot-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 24px;
        padding: 32px 96px;
        overflow: hidden;
      }
      .atlas-boot-msg {
        max-width: 760px;
        margin: 0 auto;
        width: 100%;
        display: flex;
        gap: 16px;
      }
      .atlas-boot-avatar {
        width: 32px;
        height: 32px;
        border-radius: 999px;
        background: var(--atlas-boot-skeleton, rgba(255, 255, 255, 0.04));
        flex-shrink: 0;
      }
      .atlas-boot-bubble {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding-top: 4px;
      }
      .atlas-boot-bubble > div {
        height: 12px;
        border-radius: 4px;
        background: var(--atlas-boot-skeleton, rgba(255, 255, 255, 0.04));
      }
      .atlas-boot-input {
        margin: 0 auto 16px;
        width: calc(100% - 32px);
        max-width: 760px;
        height: 86px;
        border-radius: 14px;
        background: var(--atlas-boot-card, #0c0c0c);
        border: 1px solid var(--atlas-boot-line, rgba(255, 255, 255, 0.05));
        flex-shrink: 0;
      }
      .atlas-boot-search,
      .atlas-boot-row,
      .atlas-boot-avatar,
      .atlas-boot-bubble > div {
        animation: atlas-boot-pulse 1.6s ease-in-out infinite;
      }
      @keyframes atlas-boot-pulse {
        0%, 100% { opacity: 0.5; }
        50%      { opacity: 1; }
      }

      /* No window border or corner rounding here: macOS clips the window
         to its rounded corners and draws the edge hairline itself. See
         docs/research/macos-window-corners.md before adding one back. */
    </style>
  </head>
  <body>
    <div id="root">
      <div class="atlas-boot" aria-hidden="true">
        <div class="atlas-boot-titlebar"></div>
        <div class="atlas-boot-body">
          <div class="atlas-boot-sidebar">
            <div class="atlas-boot-search"></div>
            <div class="atlas-boot-row atlas-boot-row-tall atlas-boot-row-wide"></div>
            <div class="atlas-boot-row atlas-boot-row-tall atlas-boot-row-mid"></div>
            <div class="atlas-boot-row atlas-boot-row-tall atlas-boot-row-narrow"></div>
            <div class="atlas-boot-row atlas-boot-row-tall atlas-boot-row-wide"></div>
            <div class="atlas-boot-row atlas-boot-row-tall atlas-boot-row-mid"></div>
            <div class="atlas-boot-row atlas-boot-row-tall atlas-boot-row-narrow"></div>
          </div>
          <div class="atlas-boot-main">
            <div class="atlas-boot-content">
              <div class="atlas-boot-msg">
                <div class="atlas-boot-avatar"></div>
                <div class="atlas-boot-bubble">
                  <div style="width:70%"></div>
                  <div style="width:90%"></div>
                  <div style="width:55%"></div>
                </div>
              </div>
              <div class="atlas-boot-msg">
                <div class="atlas-boot-avatar"></div>
                <div class="atlas-boot-bubble">
                  <div style="width:85%"></div>
                  <div style="width:60%"></div>
                  <div style="width:75%"></div>
                  <div style="width:40%"></div>
                </div>
              </div>
            </div>
            <div class="atlas-boot-input"></div>
          </div>
        </div>
      </div>
    </div>
    <script>
      // Defer boot-skeleton removal until React dispatches `atlas:app-ready`.
      // The skeleton stays visible across React's first commit + the Rust
      // bootstrap IPC so the user never sees an empty white flash between
      // them.
      window.addEventListener("atlas:app-ready", function () {
        var skel = document.querySelector(".atlas-boot");
        if (skel && skel.parentNode) skel.parentNode.removeChild(skel);
      }, { once: true });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
