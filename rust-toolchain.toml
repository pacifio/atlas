# The one Rust version for every machine: local checkouts, CI and the release
# workflows. CI used to float on `stable`, so a new Rust release
# brought new clippy lints into CI the day it shipped while every local run
# still used the old compiler — green here, red there, nothing changed. Bump
# this deliberately, fixing whatever the new clippy flags in the same change.
[toolchain]
channel = "1.99.0"
components = ["clippy", "rustfmt"]
# The standard library for the other OSes CI lints for. The crates flagged
# `cross` in .github/ci-crates.json are clippy'd for Windows in CI and for
# Linux too by `ci:local` on a Mac, which compiles the cfg arms the host never
# sees. Check-only: nothing is linked, so no foreign linker or SDK is needed.
targets = ["aarch64-unknown-linux-gnu", "aarch64-pc-windows-msvc"]
profile = "minimal"
