[package]
name = "atlas"
version = "0.4.0"
edition = "2021"

[lib]
name = "atlas_lib"
# rlib only. `staticlib`/`cdylib` are the Tauri mobile template's crate types
# (a native shell loads the app as a library); Atlas ships a macOS binary via
# main.rs → atlas_lib::run(). They are not free: a lib that emits a staticlib
# needs object code from every dependency, so cargo compiled all ~1,150 of
# them with machine code AND bitcode and fat LTO optimised everything twice,
# and this unit wrote a 1.7 GB libatlas_lib.a on every rebuild. Measured
# 2026-09-04 (docs/research/build-performance.md): with the fat profile this
# change alone took a clean build from 22m46s to 18m34s and cut 14% of total
# CPU; under the thin profile that replaced it (see the root Cargo.toml) a
# clean build is 8m14s at 422af792. No trade-off — nothing consumes the
# staticlib or the cdylib. Restore the two crate types only with a real
# iOS/Android target in gen/.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
# The `ported-engine` switch is gone with the path it switched away from (#54).
# The ported engine is now the only implementation of the native agent, so
# there is nothing left to select and every build contains it.

[dependencies]
atlas-process = { path = "../crates/atlas-process" }
# Devtools intentionally NOT enabled here. Release builds ship without
# right-click → Inspect Element / Cmd+Option+I; `tauri dev` still auto-
# enables devtools because the Tauri runtime turns them on for debug
# builds regardless of this feature. Add `devtools` back here only if you
# need to debug a production-only issue and accept the binary-size and
# attack-surface cost.
# `unstable` enables the multiwebview API (`Window::add_child`) used to embed a
# real WebKit child webview inside the browser tab (see `commands::browser`).
# Pinned to the 2.11.1 already in the lockfile — no new resolution.
tauri = { version = "2", features = ["protocol-asset", "macos-private-api", "unstable"] }
# Used to embed KB cover images as `data:` URLs (covers live under the
# hidden `.atlas/` dir, which the asset protocol won't serve). Pinned to the
# version already in the lockfile so no new resolution is pulled in.
base64 = "0.21"
# Allowlist HTML sanitizer (html5ever-based) for the browser reader. Replaces
# a hand-rolled string-level denylist whose bypass list kept growing —
# <meta refresh>, <base>, unquoted javascript: hrefs, `</script >` variants.
# A real parser closes the class, not the instance.
ammonia = "4"
# Plugin selection — only what JS actually invokes is kept. The Atlas
# Rust command surface does all its own fs/shell/http work via the std,
# reqwest, etc. directly; the JS side only touches: `dialog` (Open
# Folder), `opener` (external links), and `window-state` (persists size
# + position automatically). Dropping the others (fs/shell/clipboard-
# manager/process/os/http) shaves binary size + dyld load time on cold
# launches and removes their permissions surface.
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
# Single-instance: forwards the argv of a second `atlas <path>` launch to the
# already-running window so the CLI opens the target folder there instead of
# spawning a duplicate window (or, worse, restoring the last project). See
# `commands::cli` + the callback wired in `run()`.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Bundled so the Memory panel's reader of a third-party CLI's history database (in-process, WAL-concurrent) is
# self-contained and doesn't shell out to the `sqlite3` CLI.
# Pinned to rusqlite 0.39 because its `libsqlite3-sys` is 0.37, the major the
# vendored engine pins; `links = "sqlite3"` admits exactly one. Full
# rationale — and the reason 0.38 and 0.40 are both wrong — lives on the same
# declaration in `crates/atlas-thread-metadata/Cargo.toml`. Issue #39.
rusqlite = { version = "0.39", features = ["bundled"] }
# NOT `full`: that pulls every driver (process, signal, net, io-std, …)
# whether used or not. This is the measured set — add a feature when the
# compiler asks for it, which is exactly the error `full` suppressed.
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
  "fs",
  "io-util",
  "process",
  "net",
  "signal",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
# Already in the dependency tree (transitive); promoted to a direct dep so the
# Step 7 session-extraction BYOK closure can return `anyhow::Result` into
# `atlas_memory::extract::extract_and_store` (which is generic over the LLM seam).
anyhow = "1"
# The ported ACP stack (Zed port). It is the only one now: `atlas-agents`,
# `atlas-acp`, `atlas-registry` and `atlas-agentkit` are deleted.
#
# They could never have coexisted with these crates anyway, which is why the
# move had to be one change rather than a gradual one: the old stack pinned
# `agent-client-protocol` 1.3 with its schema crate pinned EXACTLY (`=1.4.0`),
# the ported one pins 2.0 / `=1.5.0`, and no single Cargo resolution can
# contain two exact 1.x pins of the same crate. That collision is also why this
# repo had no `[workspace]` for so long; with the old stack gone it is gone too,
# and the root `Cargo.toml` now owns the workspace (issue #38).
atlas-acp-thread = { path = "../crates/atlas-acp-thread" }
atlas-agent-servers = { path = "../crates/atlas-agent-servers" }
atlas-agent-store = { path = "../crates/atlas-agent-store" }
atlas-agent-manager = { path = "../crates/atlas-agent-manager" }
atlas-agent-delta = { path = "../crates/atlas-agent-delta" }
atlas-agent-wire = { path = "../crates/atlas-agent-wire" }
atlas-agent-transcript = { path = "../crates/atlas-agent-transcript" }
atlas-native-agent = { path = "../crates/atlas-native-agent" }
# Atlas's session history — the only source for the sidebar (ADR-0001).
atlas-thread-metadata = { path = "../crates/atlas-thread-metadata" }
atlas-bus = { path = "../crates/atlas-bus" }
atlas-artifacts = { path = "../crates/atlas-artifacts" }
atlas-comms = { path = "../crates/atlas-comms" }
# Only to name a crypto provider at startup — see `run()`. Both `ring` and
# `aws-lc-rs` are already in the graph via the vendored engine tree, which is
# exactly why rustls cannot pick one on its own.
rustls = { version = "0.23", features = ["aws-lc-rs"] }
agent-client-protocol = { version = "=2.0.0", features = ["unstable"] }
atlas-terminal = { path = "../crates/atlas-terminal" }
atlas-icon-theme = { path = "../crates/atlas-icon-theme" }
atlas-theme = { path = "../crates/atlas-theme" }
atlas-embed = { path = "../crates/atlas-embed" }
# On-device RAG/memory engine (MiniLM → usearch HNSW + manifest). The Tauri
# layer owns the per-project engine registry + background indexer
# (`commands::memory_indexer`); the crate itself stays Tauri-free.
atlas-memory = { path = "../crates/atlas-memory" }
# Deterministic codebase scanner (tree-sitter). Feeds the Memory-Chat RAG
# with up-to-date source structure. Drives `commands::codebase_index`.
atlas-codeindex = { path = "../crates/atlas-codeindex" }
# Structured side-by-side git diff engine (vendors delta's word-diff). Drives
# `commands::gitdiff` (diff viewer + editor gutter).
atlas-gitdiff = { path = "../crates/atlas-gitdiff" }
# Git execution chokepoint: real-binary spawns (hooks run), typed stderr →
# error taxonomy with friendly messages, porcelain-v2 status, streaming
# output. Drives `commands::git`, `commands::git_ops`, `commands::git_snapshot`.
atlas-git = { path = "../crates/atlas-git" }
# Single source of truth for secret redaction. Capture scrubs agent content on
# the way *into* the local store rather than on the way out to the network, so
# nothing downstream — sync, export, share, support bundles — has to remember to
# do it. Pure crate: no I/O, no async, no Tauri.
# The agent-session record: local SQLite store, redact-on-write capture, and
# (from ATL-83 on) commit linkage. Tauri-free, so its whole surface is
# testable against a real database and a real git repository.
atlas-checkpoint = { path = "../crates/atlas-checkpoint" }
dirs = "6"
# `canonicalize` without Windows' `\\?\` verbatim prefix, which would otherwise
# leak into workspace paths, capture ids and asset scopes. Already in the
# lockfile via the vendored engine tree, so no new resolution.
dunce = "1"
sha2 = "0.10"
# URL parsing for the embedded browser (`commands::browser`). Already in the
# lockfile transitively via tauri/reqwest; declared here to name the type.
url = "2"
# `rustls-tls` (not `native-tls`) + bundled `webpki-roots`. The macOS
# Security.framework / Keychain code path that `native-tls` uses can fail
# silently in sandboxed Hardened-Runtime release builds even with
# `com.apple.security.network.client` set — symptom: every reqwest call
# returns a TLS handshake error in `.app` form while working fine under
# `tauri dev`. rustls is self-contained: no OS keychain, no surprises.
#
# `gzip` + `brotli` so arXiv / Semantic Scholar responses (often
# gzip-encoded) decode transparently.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "charset",
    "http2",
    "rustls-tls",
    "gzip",
    "brotli",
    "stream",
] }
futures = "0.3"
ignore = "0.4"
notify = "8"
notify-debouncer-full = "0.6"
# `config.toml` (issue #64): `toml_edit` edits the on-disk document
# key-by-key so a UI/skill patch preserves comments, ordering and unknown
# keys instead of reserializing the whole file; `toml` (serde-based) does
# the typed parse/validate pass. Both pinned versions already exist in the
# workspace lockfile via vendored deps, so this adds no new resolution.
toml_edit = "0.24.0"
toml = "0.9.5"
# Per-cwd engine registry map for the background memory indexer
# (`commands::memory_indexer`). Same 6.x already used by the workspace crates.
dashmap = "6"
nucleo-matcher = "0.3"
parking_lot = "0.12"
# Drop-in replacement for the system allocator. macOS's libmalloc is one of
# the slowest mainstream mallocs for small-object workloads (heavy locking
# per free); mimalloc cuts allocation cost by ~30-60% on Tauri's
# startup-allocation-heavy hot path. `default-features = false` strips
# secure-mode + override hooks we don't need.
mimalloc = { version = "0.1", default-features = false }
# CommonMark + GFM parser used by `commands::knowledge_export` to render
# notes to HTML (single-note export, workspace export, and the standalone
# server crate template).
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
rig-core = "0.38.1"
# Loads a `.env` (cwd) at startup so source / fork builds can point telemetry at
# their own PostHog OSS project via `POSTHOG_KEY`/`POSTHOG_HOST` without a
# rebuild. Tiny, zero transitive deps. See `crate::telemetry`.
dotenvy = "0.15"
# Semver comparison for the auto-updater's version gate (PostHog `version`
# remote-config value vs the running `CARGO_PKG_VERSION`). See
# `crate::commands::updater`.
semver = "1"
posthog-rs = "0.14"
# The memory tool server (`commands::memory_server`): MCP over streamable HTTP
# on loopback. Both crates are already linked into this binary through the
# vendored engine (`atlas-engine-rmcp-client` enables exactly these rmcp
# features; `atlas-engine-app-server` these axum ones), so this adds no resolution.
rmcp = { workspace = true, features = ["server", "transport-streamable-http-server"] }
axum = { workspace = true, features = ["http1", "tokio"] }

[dev-dependencies]
# An in-process MCP client for the memory tool server's loopback tests.
# `transport-streamable-http-client-reqwest` is only the union of two features
# `atlas-engine-rmcp-client` already turns on (`transport-streamable-http-client`, and
# `__reqwest` through `auth`), so it compiles nothing new.
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
# Self-deleting temp dirs for the state/config tests.
tempfile = "3"

[target.'cfg(target_os = "windows")'.dependencies]
# Read the Windows Installer's uninstall entry for Atlas: the auto-updater
# relaunches from (and only upgrades) the MSI's `InstallLocation`. See
# `crate::commands::updater`. Already in the tree transitively.
winreg = "0.55"
# Native toasts (`crate::notifier::toast`). 0.61 is the version
# `tauri-winrt-notification` already resolves, so no second `windows` major.
windows = { version = "0.61", features = [
  "Data_Xml_Dom",
  "Foundation",
  "Foundation_Collections",
  "UI_Notifications",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# Native notifications over the freedesktop D-Bus interface
# (`crate::notifier::freedesktop`). 5.14 is the zbus `notify-rust` already
# resolves (the lockfile also holds a 4.x for other crates), default features
# (async-io), so no new resolution.
zbus = "5"

[target.'cfg(target_os = "macos")'.dependencies]
# CoreFoundation types for IOKit power assertions (keep-awake while agent runs).
core-foundation = "0.10"
# Native NSWindow access for the titlebar double-click "zoom" (AppKit
# performZoom:), which Tauri's cross-platform maximize API doesn't cover.
# Already in the tree transitively; pinned here for the direct msg_send.
objc2 = "0.6"
# Native system notifications (`crate::notifier::macos`): UNUserNotificationCenter.
# All three are already in the lockfile (objc2 0.6 / block2 0.6 / foundation 0.3);
# no second objc2 major.
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSArray",
  "NSBundle",
  "NSDictionary",
  "NSError",
  "NSObject",
  "NSSet",
  "NSString",
  "NSURL",
] }
objc2-user-notifications = { version = "0.3", default-features = false, features = [
  "std",
  "bitflags",
  "block2",
  "NSString_UserNotifications",
  "UNError",
  "UNNotification",
  "UNNotificationAction",
  "UNNotificationAttachment",
  "UNNotificationCategory",
  "UNNotificationContent",
  "UNNotificationRequest",
  "UNNotificationResponse",
  "UNNotificationSettings",
  "UNNotificationSound",
  "UNNotificationTrigger",
  "UNUserNotificationCenter",
] }
block2 = "0.6"
# Turn on atlas-embed's Metal backend so the on-device embedder runs on the
# Apple-Silicon GPU. Feature is additive over the base path dep in `[dependencies]`.
atlas-embed = { path = "../crates/atlas-embed", features = ["metal"] }

# The workspace lint table is only real for members that opt in —
# without this stanza it is dead configuration (#60).
[lints]
workspace = true
