[[setting]]
key = "confirmDeleteChat"
type = "boolean"
default = true
status = "live"
page = "general"
section = "Confirmations"
title = "Confirm before deleting a session"
summary = "Ask first when you delete a session from the sidebar or history."
doc = """
Ask before deleting a session from the sidebar or the history. A deleted
session's transcript stays with its agent, but Atlas forgets the session.
Settling never asks, because it can be undone.
"""
validation = "—"

[[setting]]
key = "confirmQuitWhileRunning"
type = "boolean"
default = true
status = "live"
page = "general"
section = "Confirmations"
title = "Confirm before quitting while an agent is running"
summary = "Ask first when you quit Atlas with an agent in the middle of a turn."
doc = """
Ask before quitting while an agent is in the middle of a turn, since quitting
stops it. Quitting again while the question is open quits anyway.
"""
validation = "—"

[[setting]]
key = "continueSessionsAfterRestart"
type = "boolean"
default = true
status = "live"
page = "chat"
section = "Running sessions"
title = "Continue sessions after a restart"
summary = "A turn cut short when Atlas quits, crashes or updates carries on when Atlas opens again."
doc = """
When Atlas quits, crashes or restarts to update while an agent is in the
middle of a turn, the next launch opens that session and tells the agent to
continue where it left off, with a row in the transcript saying so. Settled
and snoozed sessions are left alone, and a turn that keeps getting cut short
is let go after three tries in a row.
"""
validation = "—"

[[setting]]
key = "newSessionUsesLastAgent"
type = "boolean"
default = true
status = "live"
page = "chat"
section = "New sessions"
title = "Start with the last agent you picked"
summary = "A new session starts on the agent you last chose in a composer, instead of the default agent."
doc = """
A new session starts on the agent you last picked in a composer, by switching
or with the agent shortcut, as long as it is still installed. Off, or before
you have picked one, new sessions start on defaultAgent.
"""
validation = "—"

[[setting]]
key = "defaultAgent"
type = "string"
default = "atlas-agent"
status = "live"
project = true
page = "chat"
section = "New sessions"
title = "Default agent"
summary = "The agent a new session starts with."
doc = """
The agent a new session starts with: "atlas-agent" for Atlas Agent, or the id of
an installed ACP agent, such as "claude-code". An agent that isn't installed
falls back to Atlas Agent.
"""
validation = "a non-empty agent id; one that isn't installed falls back to Atlas Agent"

[[setting]]
key = "chatWidth"
type = "enum"
values = ["normal", "wide", "full"]
default = "normal"
status = "live"
page = "appearance"
section = "Interface"
title = "Session width"
summary = "How wide the conversation and the composer may grow."
doc = """
How wide the conversation and the composer may grow: "normal" (760 pixels),
"wide" (1080 pixels) or "full" (the whole panel).
"""
validation = "exactly one of these three strings"

[[setting]]
key = "wordWrap"
type = "boolean"
default = true
status = "live"
page = "appearance"
section = "Interface"
title = "Word wrap"
summary = "Wrap long lines in files, diffs and a session's code blocks instead of scrolling sideways."
doc = """
Wrap long lines in file tabs, diffs and a session's code blocks. Off: lines keep
their shape and scroll sideways. The wrap button in a file's or the review
diff's header flips this same setting.
"""
validation = "—"

[[setting]]
key = "sidebarSort"
type = "enum"
values = ["recent", "created"]
default = "recent"
status = "live"
page = "chat"
section = "Layout"
title = "Sort sessions by"
summary = "Order the sidebar's sessions by their latest activity or by when they started."
doc = """
The order of sessions in the sidebar: "recent" puts the session with the latest
activity first, "created" the one started most recently.
"""
validation = "exactly one of these two strings"

[[setting]]
key = "autoSettleAfterDays"
type = "integer"
min = 0
max = 90
default = 3
status = "live"
page = "chat"
section = "Layout"
title = "Settle idle sessions after"
summary = "A session with no activity for this many days moves to the sidebar's Settled shelf. 0 turns this off."
doc = """
Days a session may sit idle before Atlas settles it: moves it to the Settled
shelf at the bottom of the session sidebar, where it stays listed and
resumable. A session that is running, waiting for you, pinned, snoozed, or
that you un-settled since its last activity is left alone, and sending to a
settled session brings it back. 0 turns auto-settling off; settling by hand still
works. Must be between 0 and 90.
"""
validation = "0 ≤ n ≤ 90"

[[setting]]
key = "timeFormat"
type = "enum"
values = ["system", "12h", "24h"]
default = "system"
status = "live"
page = "general"
section = "System"
title = "Time format"
summary = "Show times on a 12-hour or 24-hour clock, or as your system does."
doc = """
The clock for every time of day Atlas shows: "12h", "24h", or "system" to
follow your system's region settings.
"""
validation = "exactly one of these three strings"

[[setting]]
key = "uiFontFamily"
type = "string"
default = ""
status = "live"
page = "appearance"
section = "Typography"
title = "Interface font"
summary = "The font for everything outside code and the terminal. Empty follows the theme, else the system font."
doc = """
The font for Atlas's interface and chats, as a CSS font-family list such as
"Inter, sans-serif". Empty uses the theme's font-sans if it sets one, else
the system font. A font that isn't installed
falls through to the next one in the list.
"""
validation = "a CSS font-family list, at most 200 characters, with no `{`, `}`, `;`, `<` or `>`; empty uses the system font"

[[setting]]
key = "codeFontFamily"
type = "string"
default = ""
status = "live"
page = "appearance"
section = "Typography"
title = "Code font"
summary = "The font for the editor, diffs and code in chats. Empty follows the theme, else the default."
doc = """
The font for the editor, diffs and code in chats, as a CSS font-family list
such as "JetBrains Mono, monospace". Empty uses the theme's font-mono if it
sets one, else the platform's monospace font. The terminal uses it too unless terminalFontFamily is set.
"""
validation = "a CSS font-family list, at most 200 characters, with no `{`, `}`, `;`, `<` or `>`; empty uses the default"

[[setting]]
key = "composerFontFamily"
type = "string"
default = ""
status = "live"
page = "appearance"
section = "Typography"
title = "Composer font"
summary = "The font you type prompts in. Empty uses the interface font."
doc = """
The font for the chat composer, as a CSS font-family list. Empty uses the
interface font.
"""
validation = "a CSS font-family list, at most 200 characters, with no `{`, `}`, `;`, `<` or `>`; empty uses the interface font"

[[setting]]
key = "terminalFontFamily"
type = "string"
default = ""
status = "live"
page = "appearance"
section = "Typography"
title = "Terminal font"
summary = "The terminal's font. Empty uses the code font."
doc = """
The terminal's font, as a CSS font-family list. Empty uses the code font. A
font that isn't fixed-width misaligns columns.
"""
validation = "a CSS font-family list, at most 200 characters, with no `{`, `}`, `;`, `<` or `>`; empty uses the code font"

[[setting]]
key = "editorFontSize"
type = "integer"
min = 8
max = 32
default = 13
status = "live"
page = "appearance"
section = "Typography"
title = "Editor font size"
summary = "The code editor's font size, in pixels."
doc = """
The code editor's font size, in pixels. The interface zoom scales it along
with everything else.
"""
validation = "8 ≤ n ≤ 32"

[[setting]]
key = "terminalFontSize"
type = "integer"
min = 8
max = 32
default = 13
status = "live"
page = "appearance"
section = "Typography"
title = "Terminal font size"
summary = "The terminal's font size, in pixels."
doc = """
The terminal's font size, in pixels. The interface zoom scales it along with
everything else.
"""
validation = "8 ≤ n ≤ 32"

[[setting]]
key = "diffIgnoreWhitespace"
type = "boolean"
default = false
status = "live"
page = "source-control"
section = "Diffs"
title = "Hide whitespace changes"
summary = "Leave out lines that only changed whitespace when you review a diff."
doc = """
Leave out changes that are only whitespace in diffs you read: a file's diff,
a commit, and a chat's changes. Diffs you stage from always show every change,
since a patch without the whitespace no longer applies.
"""
validation = "—"

[[setting]]
key = "diffFilesCollapsed"
type = "boolean"
default = true
status = "live"
page = "source-control"
section = "Diffs"
title = "Start files collapsed"
summary = "Open a diff with each file collapsed to its header."
doc = """
Open a diff, such as your changes or a commit, as a list of its files, each
collapsed to its header; click a file to expand it. Off: every file starts
expanded.
"""
validation = "—"

[[setting]]
key = "diffPalette"
type = "enum"
values = ["theme", "blue-orange"]
default = "theme"
status = "live"
page = "appearance"
section = "Interface"
title = "Diff colours"
summary = "Use the theme's green and red for changes, or blue and orange."
doc = """
The colours for added and removed lines: "theme" uses the theme's green and
red, "blue-orange" uses its blue and orange, which stay distinct with red-green
colour blindness.
"""
validation = "exactly one of these two strings"

[[setting]]
key = "interfaceContrast"
type = "integer"
min = 50
max = 200
default = 100
status = "live"
page = "appearance"
section = "Interface"
title = "Contrast"
summary = "Strengthen or soften borders and secondary text across the interface."
doc = """
Contrast of borders and secondary text, in percent of what the theme draws.
Above 100 moves them toward the text colour, below 100 toward the background.
Applies to every theme, the terminal and charts included.
"""
validation = "50 ≤ n ≤ 200"

[[setting]]
key = "showTurnRail"
type = "boolean"
default = true
status = "live"
page = "appearance"
section = "Interface"
title = "Turn rail"
summary = "Show a tick for each turn down the left edge of a session. Hover one to preview it, click it to jump there."
doc = """
The turn rail: a column of short ticks down the left edge of a session's
transcript, one per turn. Hovering a tick previews the prompt and the start of
the reply; clicking it jumps to that turn. Off hides the rail.
"""
validation = "—"

[[setting]]
key = "welcomeBackground"
type = "enum"
values = ["glow", "plain"]
default = "glow"
status = "live"
page = "appearance"
section = "Interface"
title = "New session background"
summary = "A coloured glow behind a new session, or the plain background."
doc = """
What sits behind a new, empty session: "glow" is a soft radial glow from the
top edge in a colour from the palette (see welcomeGlowColor), "plain" is the
theme's own background.
"""
validation = "exactly one of these two strings"

[[setting]]
key = "welcomeGlowColor"
type = "enum"
values = ["random", "ember", "plum", "ocean", "moss", "amber", "teal"]
default = "random"
status = "live"
page = "appearance"
section = "Interface"
title = "Glow colour"
summary = "A different colour each time, or always the same one."
doc = """
The colour of the new-session glow. "random" picks a different one from the
palette each time a new session opens; any other value always uses that
colour. Each has a dark and a light version, matched to the colour scheme.
Has no effect while welcomeBackground is "plain".
"""
validation = "exactly one of these seven strings"

[[setting]]
key = "autoSettleOnMerge"
type = "boolean"
default = true
status = "live"
page = "pull-requests"
section = "Sessions"
title = "Settle sessions when their pull request merges"
summary = "Move a session to Settled once its pull request merges or closes."
doc = """
Settle a session once its linked pull request merges, when the merge came
after you last worked in the session. A pull request that is closed without
merging always settles its session. Settled sessions stay listed and
resumable.
"""
validation = "—"

[[setting]]
key = "autoSettleKeepPullRequests"
type = "boolean"
default = true
status = "live"
page = "pull-requests"
section = "Sessions"
title = "Keep sessions with a pull request from settling"
summary = "Idle auto-settling leaves a session with a linked pull request alone."
doc = """
Auto-settling after days of inactivity (autoSettleAfterDays) leaves a session
alone while it has a linked pull request. Merging or closing it can still
settle the session (autoSettleOnMerge).
"""
validation = "—"

[[setting]]
key = "pullRequestWatchWakes"
type = "boolean"
default = true
status = "live"
page = "pull-requests"
section = "Sessions"
title = "Let agents act on watched pull requests"
summary = "A watched pull request can prompt its session's agent when checks fail, reviews arrive or it conflicts."
doc = """
When a session watches its pull request (the agent asked to, or you turned the
watch on), a failing check, a new review or comment, or a conflict with the
base sends the session's agent an update so it can act. Off: watches still
track the pull request but never prompt an agent.
"""
validation = "—"

[[setting]]
key = "pullRequestLinksOpenInApp"
type = "boolean"
default = true
status = "live"
page = "pull-requests"
section = "Links"
title = "Open pull request links in Atlas"
summary = "Open a pull request of the project's repository in a tab instead of the browser."
doc = """
Open a pull request link from a session, the sidebar or a transcript in
Atlas's pull request tab when it belongs to the project's repository. Off, or
a pull request of another repository: it opens in the browser.
"""
validation = "—"

[[setting]]
key = "pullRequestMergeMethod"
type = "enum"
values = ["last", "merge", "squash", "rebase"]
default = "last"
status = "live"
project = true
page = "pull-requests"
section = "Merging"
title = "Default merge method"
summary = "The method a pull request's Merge button starts on. Last used reuses your latest pick."
doc = """
The method a pull request's Merge button starts on: "merge", "squash" or
"rebase", or "last" for whichever you picked most recently on this device. A
method the repository doesn't allow falls back to one it does.
"""
validation = "exactly one of these four strings"

[[setting]]
key = "removeAgentCreditsOnMerge"
type = "boolean"
default = false
status = "live"
project = true
page = "pull-requests"
section = "Merging"
title = "Remove agent credits when merging"
summary = "Drop agent co-author and attribution lines from merge and squash messages, keeping human co-authors."
doc = """
Remove recognized agent credit lines (an agent's Co-Authored-By trailer, a
"Generated with" footer) from the message of a merge or squash Atlas performs,
auto-merge included. Human co-authors are kept. Commits already on the branch
are not rewritten.
"""
validation = "—"

[[setting]]
key = "pullRequestGuideEnabled"
type = "boolean"
default = true
status = "live"
project = true
page = "pull-requests"
section = "Review guide"
title = "Review guides"
summary = "A Guide tab on pull requests: an agent writes a tour of the change, stop by stop."
doc = """
Show the Guide tab on pull requests, where an agent writes a tour of the
change in reading order, with the calls a maintainer should make. The agent
reads a checkout of the pull request's head and changes nothing.
"""
validation = "—"

[[setting]]
key = "pullRequestGuideAgent"
type = "string"
default = ""
status = "live"
project = true
page = "pull-requests"
section = "Review guide"
title = "Guide agent"
summary = "The agent that writes review guides. Empty uses the default agent for new sessions."
doc = """
The agent that writes review guides: "atlas-agent" or an installed ACP
agent's id, such as "claude-code". Empty uses defaultAgent. An agent that
isn't installed falls back to Atlas Agent.
"""
validation = "an agent id (letters, digits, `-`, `_`, `.`), at most 64 characters; empty uses the default agent"

[[setting]]
key = "pullRequestGuideModel"
type = "string"
default = ""
status = "live"
project = true
page = "pull-requests"
section = "Review guide"
title = "Guide model"
summary = "The model the guide's agent runs on. Empty keeps the agent's own default."
doc = """
The model the guide's agent runs on, as that agent names it (the id after
the colon in favoriteModels). The guide reads the change over many steps, so
a stronger model helps. Empty keeps the agent's default; a model the agent
doesn't offer is ignored.
"""
validation = "one line, at most 200 characters; empty keeps the agent's default"

[[setting]]
key = "pullRequestGuideInstructions"
type = "string"
default = ""
status = "live"
project = true
page = "pull-requests"
section = "Review guide"
title = "Guide instructions"
summary = "Your preferences for review guides: what to show first, dwell on, or skip."
doc = """
Your preferences for review guides, added to the guide's prompt: what to show
first, dwell on or skip, and how long summaries should be. The guide's format
and its coverage of every changed file stay the same.
"""
validation = "at most 4000 bytes"

[[setting]]
key = "securityScan"
type = "boolean"
default = false
status = "file-only"
page = "privacy"
section = "Security scan"
title = "Scan new checkpoints for security issues"
summary = "Check each new checkpoint's commit for leaked credentials, risky code and vulnerable dependencies, on this machine."
doc = """
Scan each new checkpoint's commit in the background for leaked credentials,
risky calls and dependencies with known advisories. Runs entirely on this
machine; only the public advisory lists are downloaded. Results are stored
with the checkpoint and not shown yet. Commits from before it was turned on
are not scanned. Off in released builds and on in development builds unless
this key is set.
"""
validation = "—"
