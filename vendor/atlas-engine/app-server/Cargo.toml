[package]
name = "atlas-engine-app-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "atlas-engine-app-server"
path = "src/main.rs"

[[bin]]
name = "atlas-engine-app-server-test-notify-capture"
path = "src/bin/notify_capture.rs"

[[bin]]
name = "exec-server"
path = "src/bin/exec_server.rs"

[lib]
name = "atlas_engine_app_server"
path = "src/lib.rs"
doctest = false

[lints]
